<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d1226"><style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}[hidden]{display:none!important}</style></head><body><title>Mont Keys Aprender</title>

<style>
/* Layout: app de una sola pantalla con tres vistas (Mapa, Lección, Pasaporte). Tema nocturno único; cada mundo cambia el acento. */
:root{
  --night:#0d1226; --panel:#151a30; --line:rgba(241,230,207,.14); --parch:#f1e6cf; --muted:#b7ab98; --ink:#1b1712;
  --gold:#e8c27a; --gold-deep:#9c7432; --wax:#8e2b2b; --ok:#5fd0a4; --bad:#ef6b6b; --acc:#e8c27a;
  --display:'Cinzel',Georgia,serif; --body:'Alegreya Sans',system-ui,sans-serif; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;background:var(--night);color:var(--parch)}
body{font:16px/1.5 var(--body);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--night);z-index:60}
button{font-family:var(--body);color:inherit}
.view{min-height:100%}
#sky{position:fixed;inset:0;z-index:0;transition:background 1s}
#dust{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
#wx,#wxb{position:fixed;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
#wxb{z-index:1}
#map.sunny{filter:drop-shadow(0 30px 40px rgba(0,0,0,.45)) saturate(1.12) brightness(1.04)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto}
/* cabecera del mapa */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding-block:10px 14px;background:linear-gradient(180deg,rgba(11,16,36,.97),rgba(11,16,36,.8) 70%,rgba(11,16,36,0))}
.toprow{display:flex;align-items:center;gap:10px}
.wnav{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:rgba(13,18,38,.6);display:grid;place-items:center;cursor:pointer}
.wnav[disabled]{opacity:.3;cursor:default}
.wtitle{flex:1;min-width:0;text-align:center}
.eyebrow{font:500 11px var(--display);letter-spacing:.2em;color:var(--acc);text-transform:uppercase}
h1{font:700 clamp(18px,5.2vw,23px)/1.15 var(--display);margin:2px 0 0;text-wrap:balance}
.tag{font-size:13px;color:var(--muted);font-style:italic}
.stats{display:flex;justify-content:center;gap:8px;margin-top:8px}
.pill{display:flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;border:1px solid rgba(232,194,122,.3);background:rgba(13,18,38,.6);font:700 13px var(--body);font-variant-numeric:tabular-nums;color:var(--gold)}
.pill svg{width:13px;height:13px}
main{position:relative;z-index:2}
#map{width:100%;max-width:560px;display:block;margin:0 auto}
#map.float{animation:float 7s ease-in-out infinite;filter:drop-shadow(0 30px 40px rgba(0,0,0,.45))}
.node{cursor:pointer}.node:focus{outline:none}.node:focus-visible .ring{stroke:#fff;stroke-width:3}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{opacity:.75;transform:scale(1)}100%{opacity:0;transform:scale(1.9)}}
.float{animation:float 7s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.flick{animation:flick 1.6s ease-in-out infinite alternate}@keyframes flick{from{opacity:.5}to{opacity:1}}
.banner{margin:6px auto 0;max-width:560px;font-size:13px;color:var(--parch);background:rgba(13,18,38,.75);border:1px solid var(--line);border-radius:12px;padding:8px 12px;text-align:center}
/* barra inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;padding-block:8px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(9,12,26,.94);border-top:1px solid var(--line);backdrop-filter:blur(6px)}
.navrow{display:flex;justify-content:space-around;max-width:560px;margin:0 auto}
.nav button,.nav a{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font:700 12px var(--body);color:var(--muted);cursor:pointer;text-decoration:none;padding:4px}
.nav [aria-current="true"]{color:var(--gold)}
.nav svg{width:22px;height:22px}
.spacer{height:calc(78px + env(safe-area-inset-bottom,0px))}
/* hoja */
#scrim{position:fixed;inset:0;background:rgba(5,7,16,.6);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}#sheet.on{transform:none}
.card{max-width:560px;margin:0 auto;background:linear-gradient(180deg,#f4ead5,#e8d9b9);color:var(--ink);border-radius:18px;padding:18px;box-shadow:0 -10px 40px rgba(0,0,0,.45);border:1px solid #c9b48a;display:flex;flex-direction:column;gap:10px;max-height:82vh;overflow:auto}
.card .eyebrow{color:#8a5a22}.card h2{font:700 21px/1.2 var(--display);margin:0;text-wrap:balance}.card p{margin:0;color:#3a3127}
.steps4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.step4{background:rgba(27,23,18,.06);border:1px solid rgba(27,23,18,.12);border-radius:10px;padding:7px 4px;text-align:center;font-size:12px;font-weight:700;color:#4a3d2c}
.step4 span{display:block;font:500 10px var(--display);letter-spacing:.12em;color:#8a5a22}
.cta{border:0;border-radius:12px;padding:13px;font:800 16px var(--body);background:var(--wax);color:#fbeee0;cursor:pointer;width:100%}
.cta.gold{background:linear-gradient(180deg,#f0cf8a,#c99a48);color:#2b1d08}
.cta[disabled]{background:#9a8f80;color:#eee;cursor:default}
.ghost{border:1px solid currentColor;background:transparent;border-radius:12px;padding:11px;font:700 15px var(--body);cursor:pointer;width:100%}
.cta:focus-visible,.ghost:focus-visible,.opt:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.small{font-size:13px;color:#5b4a33}
/* lección */
#vLesson{position:fixed;inset:0;z-index:50;background:radial-gradient(120% 80% at 50% 0%,#1d2342,#0d1226 60%);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.lhead{display:flex;align-items:center;gap:12px;padding-block:12px}
.lx{width:34px;height:34px;flex:none;border-radius:50%;border:1px solid var(--line);background:none;cursor:pointer;display:grid;place-items:center}
.lbar{flex:1;height:10px;border-radius:6px;background:rgba(241,230,207,.12);overflow:hidden}.lbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold-deep),var(--gold));transition:width .4s}
.lphase{font:500 11px var(--display);letter-spacing:.18em;color:var(--acc);text-transform:uppercase}
.lbody{flex:1;overflow:auto;display:flex;flex-direction:column;gap:14px;padding-block:6px 14px}
.lfoot{padding-block:10px 14px}
.lq{font:700 21px/1.25 var(--body);margin:0;text-wrap:balance}
.ltext{font-size:17px;line-height:1.55;color:#e7dcc6;margin:0;max-width:62ch}
.art{border-radius:16px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(232,194,122,.1),rgba(232,194,122,.02));display:grid;place-items:center;min-height:150px;padding:12px}
.art svg{width:100%;max-width:300px;height:auto}
.fact{border-left:3px solid var(--acc);padding:8px 12px;background:rgba(232,194,122,.08);border-radius:0 10px 10px 0;font-size:15px;color:#e7dcc6}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:rgba(241,230,207,.04);border-radius:14px;padding:13px 14px;font:600 16px var(--body);cursor:pointer}
.opt.sel{border-color:var(--gold)}.opt.ok{border-color:var(--ok);background:rgba(95,208,164,.14)}.opt.bad{border-color:var(--bad);background:rgba(239,107,107,.12)}
.fb{border-radius:14px;padding:12px 14px;font-size:15px;display:none}.fb.on{display:block}
.fb.ok{background:rgba(95,208,164,.15);border:1px solid rgba(95,208,164,.5)}.fb.bad{background:rgba(239,107,107,.13);border:1px solid rgba(239,107,107,.45)}
.fb b{display:block;font-size:16px;margin-bottom:2px}
/* teclado */
.kb{position:relative;height:150px;user-select:none;-webkit-user-select:none;touch-action:none;border-radius:10px;overflow:hidden;background:#111;border:1px solid #000}
.kw{position:absolute;top:0;bottom:0;background:linear-gradient(180deg,#fdfbf6,#ece4d2);border-right:1px solid #9c9282;border-radius:0 0 6px 6px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font:700 11px var(--body);color:#6b6152}
.kbk{position:absolute;top:0;height:60%;background:linear-gradient(180deg,#2a2622,#0e0c0a);border-radius:0 0 4px 4px;z-index:2;box-shadow:0 2px 3px rgba(0,0,0,.5)}
.kw.hit,.kbk.hit{background:var(--gold)!important}.kw.good,.kbk.good{background:var(--ok)!important}.kw.wrong,.kbk.wrong{background:var(--bad)!important}.kw.hint{box-shadow:inset 0 -6px 0 var(--acc)}
.kbk.hint{box-shadow:inset 0 -6px 0 var(--acc)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chipb{border:1px solid var(--line);background:rgba(241,230,207,.05);border-radius:999px;padding:6px 12px;font:700 13px var(--body);cursor:pointer}
.chipb[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.meter{height:10px;border-radius:6px;background:rgba(241,230,207,.12);overflow:hidden}.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5fd0a4,#ffd56e 70%,#ef6b6b)}
.big{font:800 34px var(--display);text-align:center;color:var(--gold);margin:0}
.notes{display:flex;gap:6px;flex-wrap:wrap;min-height:34px}
.nchip{border-radius:8px;padding:4px 9px;background:rgba(232,194,122,.16);border:1px solid rgba(232,194,122,.4);font:700 14px var(--body)}
.tapbtn{height:120px;border-radius:24px;border:2px solid var(--gold);background:rgba(232,194,122,.12);font:800 22px var(--display);color:var(--gold);cursor:pointer;touch-action:manipulation;width:100%}
.tapbtn:active{background:rgba(232,194,122,.3)}
.done{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.stars{display:flex;gap:10px}.stars svg{width:48px;height:48px}
.acard{width:100%;background:linear-gradient(180deg,#f4ead5,#e3d1ac);color:var(--ink);border-radius:16px;padding:14px;text-align:left;border:1px solid #c9b48a;display:flex;flex-direction:column;gap:6px}
.acard h3{font:700 18px var(--display);margin:0}.acard .per{font-size:13px;color:#7a5a2a;font-weight:700}.acard p{margin:0;color:#3a3127;font-size:15px}
/* pasaporte */
.pass{position:relative;z-index:2;padding-block:16px 20px;display:flex;flex-direction:column;gap:18px}
.pass h2{font:700 22px var(--display);margin:0}
.stamps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stamp{aspect-ratio:1;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;text-align:center;font:700 10px var(--display);letter-spacing:.08em;color:var(--muted);padding:6px}
.stamp.on{border:3px double var(--sc);color:var(--sc);transform:rotate(-8deg);background:rgba(255,255,255,.03)}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.aitem{border-radius:14px;border:1px solid var(--line);background:rgba(241,230,207,.05);padding:12px;text-align:left;cursor:pointer;font:600 14px var(--body)}
.aitem small{display:block;color:var(--muted);font-weight:500}
.aitem.lock{opacity:.4;cursor:default}
.comp{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:rgba(241,230,207,.04)}
.comp b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{border:1px solid var(--line);background:none;border-radius:10px;padding:7px 10px;font:700 13px var(--body);cursor:pointer}
.empty{color:var(--muted);font-size:15px}
@media (prefers-reduced-motion:reduce){.pulse,.float,.flick{animation:none}#sheet,#scrim,.lbar i{transition:none}}
</style>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const BASE=location.pathname.replace(/\/?$/,'/'),STUDIO=BASE.replace(/[^/]+\/$/,'');
const NAMES=['Do','Do♯','Re','Re♯','Mi','Fa','Fa♯','Sol','Sol♯','La','La♯','Si'];
const LET=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const isBlack=p=>[1,3,6,8,10].includes(((p%12)+12)%12);
const nm=p=>NAMES[p%12];
const nmOct=p=>NAMES[p%12]+(Math.floor(p/12)-1);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ===================== MUNDOS Y CONTENIDO ===================== */
const W1={id:'w1',num:'I',place:'Firenze',name:'El Renacimiento italiano',tag:'Donde la música encontró una nueva voz',
 sky:'linear-gradient(180deg,#0b1024 0%,#1c1d3c 30%,#3b2a48 58%,#7a4240 80%,#c06d3c 100%)',acc:'#e8c27a',
 pal:{top:['#b9a07c','#8f7556'],cliff:['#5b4a3b','#1e1915'],mid:'#4e4033',house:'#d9c3a0',houseSh:'#b89f7c',roof:'#b35a36',roofSh:'#8a4229',tree:'#1f2e22',tree2:'#2c4230',plaza:'#cdb48c',cloud:'#e9b48a',rim:'#f6c27a',dust:'#ffd99a'},
 landmark:'duomo',stampColor:'#e8c27a',
 img:{src:'w1i.webp',w:768,h:2048,float:true,nodes:[[475,1783],[323,1662],[519,1533],[331,1375],[524,1225],[282,1101],[454,963],[276,851],[483,725],[347,599],[526,479],[447,360]],chest:[425,1454]},
 chapters:[[0,'Capítulo I · La ciudad de la música'],[3,'Capítulo II · El nacimiento del piano'],[6,'Capítulo III · Entender la música'],[9,'Capítulo IV · Expresarte']],
 lessons:[
 /* ---------------- 01 ---------------- */
 {id:'w1m01',t:'La ciudad de la música',d:'Qué es la música y qué es el sonido: agudo y grave, largo y corto, fuerte y suave, sonido y silencio.',
  disc:{id:'a-florencia',name:'La vida musical en Florencia',per:'Renacimiento · siglos XV y XVI',text:'En la Florencia de los Médici la música sonaba en iglesias, en la corte, en fiestas públicas y en las casas de las familias ricas. Los músicos aprendían de un maestro y la música se conservaba en la memoria y en manuscritos copiados a mano.',sig:'Sin grabaciones, cada interpretación era única: la música solo existía mientras alguien la tocaba.'},
  steps:[
   {type:'story',ph:'Descubrir',art:'city',title:'Bienvenido a Florencia',text:'Hace más de quinientos años, Florencia era una de las ciudades más ricas de Europa. La música sonaba en las iglesias, en la corte de los Médici, en las plazas durante las fiestas y en los talleres donde se fabricaban instrumentos.',fact:'Música es sonido y silencio organizados en el tiempo.'},
   {type:'story',ph:'Aprender',art:'wave',title:'¿Qué es el sonido?',text:'Todo sonido empieza con algo que vibra: una cuerda, una membrana, el aire dentro de una flauta. La vibración viaja por el aire hasta nosotros. También se puede sentir: apoya la mano sobre un piano mientras suena. En esta lección cada sonido aparece también dibujado como una onda.',fact:'Vibración rápida = agudo · lenta = grave · grande = fuerte · larga = sonido largo.'},
   {type:'listen',ph:'Práctica',q:'Agudo y grave',items:[{a:{p:84},b:{p:43},ask:'¿Cuál es más agudo?',ans:'a'},{a:{p:48},b:{p:79},ask:'¿Cuál es más grave?',ans:'a'},{a:{p:60},b:{p:72},ask:'¿Cuál es más agudo?',ans:'b'}]},
   {type:'listen',ph:'Práctica',q:'Largo y corto',items:[{a:{p:67,dur:1.6},b:{p:67,dur:.2},ask:'¿Cuál es más largo?',ans:'a'},{a:{p:60,dur:.15},b:{p:60,dur:1.2},ask:'¿Cuál es más corto?',ans:'a'}]},
   {type:'listen',ph:'Práctica',q:'Sonido y silencio',items:[{a:{p:64,dur:1},b:{silent:true,dur:1},ask:'¿Cuál es silencio?',ans:'b'},{a:{silent:true,dur:1},b:{p:57,dur:1},ask:'¿Cuál tiene sonido?',ans:'b'}]},
   {type:'listen',ph:'Práctica',q:'Fuerte y suave',items:[{a:{p:64,vel:.15},b:{p:64,vel:1},ask:'¿Cuál es más fuerte?',ans:'b'},{a:{p:55,vel:1},b:{p:55,vel:.12},ask:'¿Cuál es más suave?',ans:'b'}]},
   {type:'timbre',ph:'Práctica',q:'¿Qué instrumento suena?',items:[{kind:'flute',opts:['Flauta','Tambor','Clavecín'],a:0},{kind:'drum',opts:['Violín','Tambor','Flauta'],a:1},{kind:'harpsi',opts:['Clavecín','Tambor','Flauta'],a:0}]},
   {type:'create',ph:'Reto creativo',q:'Tu primera secuencia de sonidos',sub:'Toca 6 notas: mezcla graves y agudos, y toca algunas suave (arriba en la tecla) y otras fuerte (abajo). Escúchala al terminar.',len:6,lo:48,hi:76,dyn:true}

 /* ---------------- 02 ---------------- */
 {id:'w1m02',t:'El origen de los instrumentos',d:'Cómo producen sonido los instrumentos y cómo se agrupan en familias: cuerda, viento, percusión y teclado.',
  disc:{id:'a-familias',name:'Cómo se clasifican los instrumentos',per:'Sistema publicado en 1914',text:'Los musicólogos Erich von Hornbostel y Curt Sachs propusieron en 1914 clasificar los instrumentos según qué vibra: una cuerda, una columna de aire, una membrana o el propio cuerpo del instrumento. Su sistema, con ampliaciones posteriores, se sigue usando en los museos.',sig:'Saber qué vibra te ayuda a entender por qué cada instrumento suena como suena.'},
  steps:[
   {type:'story',ph:'Descubrir',art:'families',title:'¿Qué es lo que vibra?',text:'Cada instrumento hace vibrar algo distinto. En la cuerda vibra una cuerda frotada, pulsada o golpeada. En el viento vibra el aire dentro de un tubo. En la percusión vibra una membrana o el cuerpo del instrumento al golpearlo. El piano es especial: es de teclado, pero por dentro unos martillos golpean cuerdas.',fact:'Cuerda · viento · percusión · y los teclados, que pueden usar cuerdas o tubos.'},
   {type:'sort',ph:'Práctica',q:'Clasifica cada instrumento en su familia',fams:['Cuerda','Viento','Percusión'],items:[['Violín',0],['Flauta',1],['Tambor',2],['Laúd',0],['Trompeta',1],['Pandero',2],['Arpa',0],['Chirimía',1]]},
   {type:'choice',ph:'Práctica',q:'¿Cómo produce el sonido una flauta?',opts:['Vibra una cuerda','Vibra el aire dentro del tubo','Se golpea una membrana'],a:1,why:'En los instrumentos de viento vibra la columna de aire.'},
   {type:'choice',ph:'Práctica',q:'¿Y el tambor?',opts:['Vibra una membrana al golpearla','Vibra el aire','Vibra una cuerda'],a:0,why:'Al golpear, la membrana (el parche) vibra.'},
   {type:'timbre',ph:'Práctica',q:'Escucha y mira: ¿de qué familia es?',items:[{kind:'strings',opts:['Cuerda','Viento','Percusión'],a:0},{kind:'flute',opts:['Cuerda','Viento','Percusión'],a:1},{kind:'drum',opts:['Cuerda','Viento','Percusión'],a:2}]},
   {type:'ensemble',ph:'Reto creativo',q:'Arma tu agrupación',sub:'Elige al menos un instrumento de cada familia y escucha cómo suenan juntos.'}
  ]},
 /* ---------------- 03 ---------------- */
 {id:'w1m03',t:'El lenguaje escrito',d:'Cómo se escribe la música: líneas, espacios y los primeros símbolos.',
  disc:{id:'a-guido',name:'Guido d’Arezzo',per:'Monje italiano · nacido hacia el año 991',text:'Maestro de música que ideó un sistema de líneas separadas por terceras para escribir la altura exacta de las notas, la base de nuestro pentagrama, y un método con sílabas para aprender a cantar. Lo explicó en su tratado «Micrologus», escrito hacia 1025.',sig:'Gracias a su sistema, un cantante podía aprender una melodía nueva leyendo, sin oírla antes.'},
  steps:[
   {type:'story',ph:'Descubrir',art:'staff',title:'Escribir el sonido',text:'Durante siglos la música se aprendía de oído. En el siglo XI el monje Guido d’Arezzo perfeccionó una idea: dibujar líneas y colocar las notas sobre ellas y entre ellas. Cuanto más arriba está la nota, más aguda suena.',fact:'Hoy usamos 5 líneas y 4 espacios: el pentagrama.'},
   {type:'choice',ph:'Práctica',q:'¿Cuántas líneas tiene el pentagrama?',opts:['4','5','6'],a:1,why:'Penta = cinco.'},
   {type:'linespace',ph:'Práctica',q:'¿La nota está en una línea o en un espacio?',items:[64,65,67,69,71,72]},
   {type:'choice',ph:'Práctica',q:'Si una nota está más arriba en el pentagrama, suena…',opts:['Más aguda','Más grave','Más fuerte'],a:0,why:'Arriba = agudo, abajo = grave.'},
   {type:'complete',ph:'Práctica',q:'Completa el patrón',sub:'Las notas suben paso a paso. ¿Cuál falta? Tócala.',seq:[60,62,64,null],ans:65,lo:57,hi:72},
   {type:'complete',ph:'Práctica',q:'Completa el patrón',sub:'Ahora bajan.',seq:[72,71,69,null],ans:67,lo:57,hi:76},
   {type:'reverse',ph:'Reto creativo',q:'Escribe tocando',sub:'Toca 6 notas y mira cómo aparecen escritas en el pentagrama. Así se convierte el sonido en escritura.',count:6,lo:60,hi:76}
  ]},
 /* ---------------- 04 ---------------- */
 {id:'w1m04',t:'Los instrumentos olvidados',d:'El clavecín y el clavicordio: cómo suenan, cómo funcionan y de qué época son.',
  disc:{id:'a-clavecin',name:'El clavecín',per:'Usado sobre todo entre los siglos XVI y XVIII',text:'Instrumento de teclado en el que cada tecla acciona una pieza que pulsa la cuerda con una púa, tradicionalmente de pluma de ave. Las primeras menciones de instrumentos de este tipo aparecen hacia finales del siglo XIV.',sig:'Pulsar la cuerda da casi el mismo volumen sin importar la fuerza del dedo: por eso se buscaba un teclado más expresivo.'},
  steps:[
   {type:'story',ph:'Descubrir',art:'harpsi',title:'El clavecín',text:'Antes del piano, el gran instrumento de teclado era el clavecín. Al bajar una tecla, una púa sube y pellizca la cuerda. Su sonido es brillante, y toques fuerte o suave suena casi igual.',fact:'Muy usado en el Renacimiento y el Barroco.'},
   {type:'story',ph:'Descubrir',art:'clavi',title:'El clavicordio',text:'En el clavicordio una pequeña lámina de metal (la tangente) golpea la cuerda y se queda tocándola. Permitía matices, pero sonaba tan suave que servía sobre todo para estudiar en casa.',fact:'Con el clavicordio se podía hacer un ligero vibrato moviendo el dedo.'},
   {type:'compare',ph:'Práctica',q:'Compara: la misma nota suave y fuerte',a:'harpsi',b:'piano',why:'En el clavecín las dos ondas son casi iguales. En el piano, la fuerte es mucho más grande.'},
   {type:'timbre',ph:'Práctica',q:'¿Qué instrumento es?',items:[{kind:'harpsi',opts:['Clavecín','Piano'],a:0},{kind:'piano',opts:['Clavecín','Piano'],a:1},{kind:'harpsi',opts:['Piano','Clavecín'],a:1}]},
   {type:'choice',ph:'Práctica',q:'¿Cuál era la limitación del clavecín?',opts:['No tenía notas agudas','No permitía tocar más fuerte o más suave con el dedo','Era muy pequeño'],a:1,why:'Esa limitación es la que intentaría resolver Cristofori.'},
   {type:'melody',ph:'Reto creativo',q:'Toca una melodía con sonido de clavecín',sub:'Sigue las teclas iluminadas. Al terminar, tócala de nuevo con sonido de piano y compara.',notes:[60,62,64,65,67,65,64,62,60],kind:'harpsi',show:'keys',lo:57,hi:72,again:'piano'}
  ]},
 /* ---------------- 05 ---------------- */
 {id:'w1m05',t:'El nacimiento del piano',d:'Bartolomeo Cristofori y su mecanismo de martillos, hacia 1700: tocar piano y forte.',
  disc:{id:'a-cristofori',name:'El piano de Cristofori',per:'Florencia · hacia 1700',text:'Bartolomeo Cristofori (1655–1731), constructor de instrumentos al servicio de Fernando de Médici, creó un teclado en el que martillos golpean las cuerdas. Un inventario de los Médici del año 1700 ya lo describe. El piano más antiguo que se conserva es suyo y data de 1720 (Museo Metropolitano de Nueva York).',sig:'Por primera vez, la fuerza del dedo controlaba el volumen: el «gravicembalo col piano e forte».'},
  steps:[
   {type:'story',ph:'Descubrir',art:'cristofori',title:'Bartolomeo Cristofori',text:'Cristofori trabajaba en Florencia para el príncipe Fernando de Médici. Hacia 1700 terminó un instrumento nuevo: un martillo golpea la cuerda y rebota enseguida, dejándola vibrar. Cuanto más rápido baja el dedo, más fuerte suena.',fact:'«Gravicembalo col piano e forte»: de ahí viene la palabra «piano».'},
   {type:'story',ph:'Aprender',art:'dyn',title:'Piano y forte',text:'«Piano» (p) significa suave y «forte» (f) significa fuerte. En este teclado, toca cerca del fondo de la tecla (arriba) para tocar suave y cerca de la punta (abajo) para tocar fuerte. El medidor te muestra la intensidad.',fact:'pp · p · mp · mf · f · ff'},
   {type:'dyn',ph:'Práctica',q:'Piano y forte',sub:'Sigue lo que pide cada nota.',items:['p','f','p','f','f','p']},
   {type:'cresc',ph:'Práctica',q:'Crescendo',sub:'Toca 5 notas, cada una un poco más fuerte que la anterior.',dir:'up',count:5},
   {type:'melody',ph:'Reto creativo',q:'La misma melodía, dos expresiones',sub:'Primero tócala toda piano (suave)…',notes:[64,64,65,67,67,65,64,62],show:'keys',lo:57,hi:72,dynReq:'p'},
   {type:'melody',ph:'Reto creativo',q:'…y ahora forte',sub:'La misma melodía, ahora toda fuerte. ¿Notas cómo cambia el carácter?',notes:[64,64,65,67,67,65,64,62],show:'keys',lo:57,hi:72,dynReq:'f'}
  ]},
 /* ---------------- 06 ---------------- */
 {id:'w1m06',t:'Las siete teclas',d:'Orientarse en el teclado: los Do, los grupos de teclas negras, graves y agudos.',
  disc:{id:'a-utremi',name:'Ut, re, mi: los nombres de las notas',per:'Siglo XI en adelante',text:'Guido d’Arezzo usó las sílabas iniciales de los versos del himno «Ut queant laxis» (ut, re, mi, fa, sol, la) para enseñar a cantar. Más tarde «ut» se cambió por «do» (un cambio que suele atribuirse a Giovanni Battista Doni, en el siglo XVII) y se añadió «si».',sig:'En los países latinos usamos Do-Re-Mi; en los anglosajones, letras: C D E F G A B.'},
  steps:[
   {type:'story',ph:'Descubrir',art:'groups',title:'Siete nombres y dos grupos',text:'Las teclas blancas tienen siete nombres: Do, Re, Mi, Fa, Sol, La, Si, y luego se repiten. Las negras van en grupos de dos y de tres: el Do está justo a la izquierda del grupo de dos, y el Fa a la izquierda del grupo de tres.',fact:'C D E F G A B = Do Re Mi Fa Sol La Si'},
   {type:'keys',ph:'Práctica',lo:36,hi:84,labels:false,items:[{say:'Encuentra un Do',pc:0},{say:'Otro Do distinto',pc:0,notSame:true},{say:'Y otro Do más',pc:0,notSame:true}]},
   {type:'keys',ph:'Práctica',lo:48,hi:72,labels:false,items:[{say:'Toca una negra de un grupo de DOS',pcs:[1,3]},{say:'Toca una negra de un grupo de TRES',pcs:[6,8,10]}]},
   {type:'keys',ph:'Práctica',lo:48,hi:72,labels:false,random:5,items:[]},
   {type:'keys',ph:'Práctica',lo:36,hi:84,labels:false,items:[{say:'El Do más grave',exact:36},{say:'El Do más agudo',exact:84}]},
   {type:'melody',ph:'Práctica',q:'Reproduce la secuencia',sub:'Sigue las teclas iluminadas.',notes:[60,62,64,65,67,67,65,64,62,60],show:'keys',lo:57,hi:72},
   {type:'melody',ph:'Reto creativo',q:'Cinco notas de memoria',sub:'Escucha la melodía (puedes repetirla) y tócala sin ayuda visual. Si fallas tres veces, aparece una pista.',notes:[60,64,67,64,60],show:'none',lo:57,hi:72}
  ]},
 /* ---------------- 07 ---------------- */
 {id:'w1m07',t:'El mapa musical',d:'Conectar partitura y teclado: clave de Sol, clave de Fa y leer pequeñas melodías.',
  disc:{id:'a-claves',name:'De letras a claves',per:'Edad Media',text:'Las claves nacieron como letras escritas al inicio de una línea para indicar qué nota era: una G (Sol), una F (Fa) o una C (Do). Con el tiempo esas letras se fueron transformando hasta las formas que usamos hoy.',sig:'La clave de Sol todavía se enrosca alrededor de la línea de Sol: es una G muy decorada.'},
  steps:[
   {type:'story',ph:'Aprender',art:'clefs',title:'Las claves',text:'La clave de Sol se enrosca en la segunda línea: esa línea es Sol. La clave de Fa marca con sus dos puntos la cuarta línea: Fa. La mano derecha suele leer en clave de Sol y la izquierda en clave de Fa.',fact:'El Do central va en una línea adicional debajo del pentagrama de Sol.'},
   {type:'staff',ph:'Práctica',clef:'G',lo:57,hi:79,items:[67,60,64,72,69,65]},
   {type:'staff',ph:'Práctica',clef:'F',lo:38,hi:62,items:[53,48,55,43]},
   {type:'melody',ph:'Práctica',q:'Lee y toca',sub:'Toca la nota marcada en el pentagrama. Puedes ver los nombres si los necesitas.',notes:[60,60,67,67,69,69,67],show:'staff',lo:57,hi:72},
   {type:'complete',ph:'Práctica',q:'Completa la partitura',sub:'Falta la última nota: termina la melodía en la misma nota con la que empezó.',seq:[67,65,64,62,null],ans:67,lo:57,hi:72},
   {type:'reverse',ph:'Lectura inversa',q:'Toca y mira',sub:'Toca libremente: Mont Keys escribe en el pentagrama lo que tocas.',count:8,lo:60,hi:76},
   {type:'melody',ph:'Reto creativo',q:'Tu primera partitura',sub:'Interpreta esta pequeña partitura solo leyendo el pentagrama.',notes:[64,62,60,62,64,64,64],show:'staff',lo:57,hi:72,noLabels:true}
  ]},
 /* ---------------- 08 ---------------- */
 {id:'w1m08',t:'El reloj del ritmo',d:'Pulso, figuras, silencios, compases de 4/4 y 3/4, y subdivisiones.',
  disc:{id:'a-mensural',name:'La notación mensural',per:'Europa · siglos XIII a XVI',text:'Sistema para escribir la duración de las notas con figuras de distintas formas. Uno de sus textos más influyentes es el «Ars cantus mensurabilis», atribuido a Franco de Colonia y escrito hacia 1260.',sig:'De estas figuras medievales vienen las redondas, blancas y negras de hoy.'},
  steps:[
   {type:'story',ph:'Aprender',art:'figures',title:'Pulso y figuras',text:'El pulso es el latido regular de la música. La redonda dura 4 pulsos, la blanca 2, la negra 1 y la corchea medio. Un silencio también dura: es tiempo sin sonido que se cuenta igual.',fact:'4/4: cuatro negras por compás · 3/4: tres, como un vals.'},
   {type:'rhythm',ph:'Práctica',q:'Mantén el pulso',sub:'Después de 4 pulsos de preparación, toca en cada negra.',bpm:80,bars:2,beats:4,pattern:[0,1,2,3,4,5,6,7]},
   {type:'rhythm',ph:'Práctica',q:'Negra, negra, blanca',sub:'La blanca dura dos pulsos: no toques en el cuarto.',bpm:80,bars:2,beats:4,pattern:[0,1,2,4,5,6]},
   {type:'rhythm',ph:'Práctica',q:'Con silencio',sub:'Negra, silencio, negra, negra: no toques en el segundo pulso.',bpm:80,bars:2,beats:4,pattern:[0,2,3,4,6,7]},
   {type:'rhythm',ph:'Práctica',q:'Compás de 3/4',sub:'Tres pulsos por compás, como un vals. Toca los tres.',bpm:90,bars:2,beats:3,pattern:[0,1,2,3,4,5]},
   {type:'rhythm',ph:'Práctica',q:'Subdivisión: corcheas',sub:'Dos toques por pulso en los dos primeros pulsos, luego dos negras.',bpm:70,bars:2,beats:4,pattern:[0,.5,1,1.5,2,3,4,4.5,5,5.5,6,7]},
   {type:'rhythmMake',ph:'Reto creativo',q:'Inventa tu ritmo',sub:'Durante un compás toca el ritmo que quieras (4 a 8 toques). Luego escucharás tu ritmo y tendrás que repetirlo.',bpm:80,beats:4},
   {type:'rhythm',ph:'Reto creativo',q:'Repite tu propio ritmo',sub:'Este es tu ritmo: tócalo dos veces seguidas.',bpm:80,bars:2,beats:4,pattern:'mine'}
  ]},
 /* ---------------- 09 ---------------- */
 {id:'w1m09',t:'El arte de la melodía',d:'Subir y bajar, repetir y variar, completar frases y crear preguntas y respuestas.',
  disc:{id:'a-pavana',name:'Pavana y gallarda',per:'Danzas cortesanas · siglo XVI',text:'En las cortes renacentistas se bailaban danzas que a menudo iban en pareja: la pavana, lenta y en compás binario, seguida de la gallarda, rápida y en ternario, que muchas veces reutilizaba la misma melodía.',sig:'Una misma idea musical, repetida y transformada, ya era una herramienta de composición hace 500 años.'},
  steps:[
   {type:'story',ph:'Aprender',art:'contour',title:'La forma de una melodía',text:'Una melodía puede subir (ascendente), bajar (descendente) o repetir notas. Las melodías que recordamos mezclan las tres cosas y suelen repetir una idea con pequeños cambios: eso se llama variación.',fact:'Pregunta = frase que queda abierta · Respuesta = frase que cierra.'},
   {type:'contour',ph:'Práctica',q:'¿Hacia dónde va la melodía?',items:[{notes:[60,62,64,67],a:0},{notes:[72,69,67,64],a:1},{notes:[65,65,65,65],a:2},{notes:[60,64,62,60],a:3}]},
   {type:'contour',ph:'Práctica',q:'¿Repetición o variación?',mode:'rv',items:[{notes:[60,62,64],notes2:[60,62,64],a:0},{notes:[60,62,64],notes2:[60,62,65],a:1},{notes:[67,65,64],notes2:[67,65,64],a:0}]},
   {type:'complete',ph:'Práctica',q:'Completa la frase',sub:'La frase sube y baja: ¿qué nota la cierra en casa (Do)?',seq:[60,64,67,64,62,null],ans:60,lo:57,hi:72},
   {type:'phrase',ph:'Práctica',q:'Pregunta y respuesta',sub:'Escucha la pregunta (4 notas) y responde con 4 notas tuyas. Consejo: terminar en Do suena a respuesta.',question:[60,62,64,67],len:4,lo:57,hi:72},
   {type:'create',ph:'Reto creativo',q:'Compón una melodía de 8 notas',sub:'Usa movimientos que suban y bajen, repite una idea con una variación y elige negras o blancas.',len:8,lo:60,hi:77,durations:true,save:true,title:'Mi melodía de Florencia'}
  ]},
 /* ---------------- 10 ---------------- */
 {id:'w1m10',t:'El lenguaje de la expresión',d:'Dinámicas, staccato y legato, crescendo y diminuendo: darle personalidad a la música.',
  disc:{id:'a-gabrieli',name:'«Sonata pian’ e forte»',per:'Venecia · 1597',text:'Giovanni Gabrieli publicó en 1597 una sonata para conjunto de instrumentos que se considera una de las primeras obras con indicaciones escritas de piano y forte. Los términos de expresión en italiano se volvieron el idioma común de los músicos.',sig:'Por eso en todo el mundo escribimos piano, forte, crescendo o legato… en italiano.'},
  steps:[
   {type:'story',ph:'Aprender',art:'artic',title:'Staccato y legato',text:'Staccato es tocar notas cortas y separadas, soltando la tecla enseguida. Legato es tocar ligado, manteniendo cada nota hasta que empieza la siguiente. Crescendo es ir subiendo el volumen y diminuendo, bajarlo.',fact:'staccato · = corto · legato ⌒ = ligado · crescendo < · diminuendo >'},
   {type:'artic',ph:'Práctica',q:'Staccato y legato',sub:'Staccato: toca y suelta rápido. Legato: mantén la tecla al menos medio segundo.',items:['s','s','l','l','s','l']},
   {type:'cresc',ph:'Práctica',q:'Crescendo',sub:'5 notas, cada una más fuerte.',dir:'up',count:5},
   {type:'cresc',ph:'Práctica',q:'Diminuendo',sub:'5 notas, cada una más suave.',dir:'down',count:5},
   {type:'timbre',ph:'Práctica',q:'¿Cómo se tocó?',mode:'artic',items:[{art:'s',opts:['Staccato','Legato'],a:0},{art:'l',opts:['Staccato','Legato'],a:1}]},
   {type:'melody',ph:'Reto creativo',q:'Una melodía, dos personalidades',sub:'Primero tócala staccato: notas cortas…',notes:[67,65,64,62,60],show:'keys',lo:57,hi:72,artReq:'s'},
   {type:'melody',ph:'Reto creativo',q:'…y ahora legato',sub:'La misma melodía, manteniendo cada nota.',notes:[67,65,64,62,60],show:'keys',lo:57,hi:72,artReq:'l'}
  ]},
 /* ---------------- 11 ---------------- */
 {id:'w1m11',t:'El taller del compositor',d:'Crear, variar, grabar y organizar tu primera pieza en el estudio de Mont Keys.',
  disc:{id:'a-bocetos',name:'Los cuadernos de bocetos',per:'Una costumbre de siglos',text:'Muchos compositores anotaban ideas sueltas antes de convertirlas en obras. Los cuadernos de bocetos de Beethoven, por ejemplo, muestran temas reescritos una y otra vez hasta encontrar su forma final.',sig:'Componer no es acertar a la primera: es probar, cambiar y volver a probar.'},
  steps:[
   {type:'story',ph:'Descubrir',art:'quill',title:'De aprendiz a compositor',text:'Ya sabes encontrar las notas, leerlas, medir su duración y darles expresión. En el taller vas a crear una idea, variarla y organizarla. No hay una respuesta correcta: hay decisiones.',fact:'Idea · repetición · variación · final.'},
   {type:'create',ph:'Práctica',q:'Tu idea principal',sub:'Escribe una idea de 4 notas.',len:4,lo:60,hi:77,keep:'idea'},
   {type:'revise',ph:'Práctica',q:'Varíala',sub:'Cambia al menos una nota o una figura de tu idea. Toca un chip para seleccionarlo y luego una tecla para cambiarlo.',from:'idea',keep:'var'},
   {type:'create',ph:'Reto creativo',q:'Organiza tu pieza',sub:'Escribe 8 notas: tu idea, su variación y un final que suene completo. Elige negras o blancas y usa dinámica.',len:8,lo:60,hi:77,durations:true,dyn:true,save:true,title:'Pieza del taller',studio:true}
  ]}
 ],
 finale:{id:'w1f',t:'La primera creación musical',d:'El reto final del mundo: crea tu composición usando todo lo que aprendiste.',
  disc:{id:'a-sello1',name:'Sello de Italia · Primer compositor',per:'Mundo I completado',text:'Recorriste Florencia: del sonido a los instrumentos, de Cristofori al teclado, de la partitura al ritmo, de la melodía a la expresión, hasta tu primera obra.',sig:'Logro «Primer compositor» y acceso al siguiente mundo.'},
  steps:[

let AC=null,master=null;

function tone(p,vel=.7,dur=.7,kind='piano',when){const a=ac(),t=when||a.currentTime+.01,f=440*Math.pow(2,(p-69)/12),g=a.createGain(),amp=.05+.28*vel;

  if(kind==='flute'||kind==='strings'||kind==='lute'){const o=a.createOscillator(),lp=a.createBiquadFilter(),lfo=a.createOscillator(),lg=a.createGain();o.type=kind==='flute'?'sine':kind==='strings'?'sawtooth':'triangle';o.frequency.value=f;lfo.frequency.value=5.2;lg.gain.value=kind==='lute'?0:f*.006;lfo.connect(lg);lg.connect(o.frequency);lp.type='lowpass';lp.frequency.value=kind==='strings'?2600:kind==='flute'?3000:2200;o.connect(lp);lp.connect(g);
   const att=kind==='lute'?.004:kind==='flute'?.06:.09,A=amp*(kind==='strings'?.7:1);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(A,t+att);if(kind==='lute')g.gain.exponentialRampToValueAtTime(.001,t+Math.max(.5,dur+.4));else{g.gain.setValueAtTime(A,t+Math.max(att,dur));g.gain.linearRampToValueAtTime(0,t+dur+.15)}g.connect(master);[o,lfo].forEach(x=>{x.start(t);x.stop(t+dur+.6)});return}

  const o=a.createOscillator(),o2=a.createOscillator(),lp=a.createBiquadFilter();o.type='triangle';o2.type='sine';o.frequency.value=f;o2.frequency.value=f*2;lp.type='lowpass';lp.frequency.value=900+4500*vel;const g2=a.createGain();g2.gain.value=.3;o2.connect(g2);g2.connect(lp);o.connect(lp);lp.connect(g);

let mic=null;
async function micOn(onNote){if(mic)return true;try{let st;try{st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}})}catch(e){if(e&&e.name==='NotAllowedError')throw e;st=await navigator.mediaDevices.getUserMedia({audio:true})}
  const a=ac(),src=a.createMediaStreamSource(st),an=a.createAnalyser();an.fftSize=2048;src.connect(an);const buf=new Float32Array(2048);let last=-1,since=0,fired=-1,run=true;
  (function loop(){if(!run)return;an.getFloatTimeDomainData(buf);const f=detect(buf,a.sampleRate);if(f){const p=Math.round(69+12*Math.log2(f/440));if(p===last){if(performance.now()-since>120&&fired!==p){fired=p;onNote(p)}}else{last=p;since=performance.now()}}else{last=-1;fired=-1}requestAnimationFrame(loop)})();
  mic={stop(){run=false;st.getTracks().forEach(t=>t.stop());mic=null}};return true}catch(e){toast('No pude usar el micrófono'+(e&&e.name?' ('+e.name+')':'')+'. Usa el teclado de la pantalla.');return false}}
function detect(b,sr){let rms=0;for(let i=0;i<b.length;i++)rms+=b[i]*b[i];rms=Math.sqrt(rms/b.length);if(rms<.015)return 0;const n=b.length/2;let best=0,bl=-1;for(let lag=Math.floor(sr/1100);lag<Math.floor(sr/60);lag++){let c=0;for(let i=0;i<n;i++)c+=b[i]*b[i+lag];if(c>best){best=c;bl=lag}}if(bl<0)return 0;let e=0;for(let i=0;i<n;i++)e+=b[i]*b[i];if(best/e<.5)return 0;return sr/bl}
function micOff(){if(mic)mic.stop()}

  const whites=[];for(let p=lo;p<=hi;p++)if(!isBlack(p))whites.push(p);const ww=100/whites.length,els={};
  whites.forEach((p,i)=>{const k=document.createElement('div');k.className='kw';k.style.left=(i*ww)+'%';k.style.width=ww+'%';k.dataset.p=p;if(labels)k.textContent=nm(p);kb.appendChild(k);els[p]=k});
  for(let p=lo;p<=hi;p++)if(isBlack(p)){const i=whites.indexOf(p-1);if(i<0)continue;const k=document.createElement('div');k.className='kbk';k.style.left=((i+1)*ww-ww*.3)+'%';k.style.width=(ww*.6)+'%';k.dataset.p=p;kb.appendChild(k);els[p]=k}

    k.classList.add('hit');setTimeout(()=>k.classList.remove('hit'),180);tone(p,vel,.7,kind?kind():'piano');downs[e.pointerId]={p,t:performance.now()};onKey&&onKey(p,vel)});
  const downs={},up=e=>{const d=downs[e.pointerId];if(!d)return;delete downs[e.pointerId];onRelease&&onRelease(d.p,(performance.now()-d.t)/1000)};kb.addEventListener('pointerup',up);kb.addEventListener('pointercancel',up);kb.addEventListener('pointerleave',up);
  return {flash(p,c,ms=500){const k=els[p];if(!k)return;k.classList.add(c);setTimeout(()=>k.classList.remove(c),ms)},hint(p,on){const k=els[p];if(k)k.classList.toggle('hint',on)},els}

function saveComp(title,notes){let t=0;const bl=.5,arr=notes.map(n=>{const s=t;t+=n.d*bl;return [ +s.toFixed(3), +(t-.02).toFixed(3), n.p, Math.round(30+n.v*90), n.p>=60?'R':'L']});const id='c'+Date.now().toString(36);S.comps.unshift({id,title,notas:arr,dur:+t.toFixed(2),date:new Date().toISOString()});if(LS)LS.lastComp=id;save();toast('Composición guardada en tu Pasaporte.')}

 const st=[0,1,2].map(i=>`<svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 21l1.6-7L2 9.2l7.1-.6z" fill="${i<stars?'#f3d48e':'rgba(241,230,207,.15)'}" stroke="${i<stars?'#8c6326':'none'}"/></svg>`).join('');

  else if(a==='studio'){try{localStorage.setItem('mk_import',JSON.stringify({app:'Mont Keys',pieza:{titulo:c.title,notas:c.notas.map(n=>[n[0],n[1],n[2],n[3],n[4],0,null,null,null]),duracion:c.dur,bpm:120,compas:4,estado:'lista',creado:c.date,origen:'aprender'}}));location.href=STUDIO}catch(e){toast('No pude pasarla al estudio en este navegador.')}}})});
}
$('#resetAll').onclick=()=>{sheet(`<h2>¿Borrar todo tu progreso?</h2><p>Se borran XP, florines, lecciones, Archivo y composiciones guardadas en este teléfono. No se puede deshacer.</p><button class="cta" id="y" type="button">Borrar todo</button><button class="ghost" id="n" type="button">Cancelar</button>`);$('#y').onclick=()=>{S={xp:0,coins:0,done:{},archive:[],comps:[],streak:{last:'',n:0},chests:{},world:0};save();closeSheet();drawPass();curW=0;drawMap()};$('#n').onclick=closeSheet};

/* ===================== NAVEGACIÓN ===================== */
function show(v){$('#vMap').hidden=v!=='map';$('#vPass').hidden=v!=='pass';$('#nMap').setAttribute('aria-current',v==='map');$('#nPass').setAttribute('aria-current',v==='pass');if(v==='pass')drawPass();window.scrollTo(0,v==='map'?scrollCur():0)}
$('#nMap').onclick=()=>show('map');$('#nPass').onclick=()=>show('pass');

function updateStats(){$('#sXp').textContent=S.xp;$('#sCoins').textContent=S.coins;$('#sStreak').textContent=S.streak.n||0}
function scrollCur(){const W=WORLDS[curW];let i=W.preview?0:W.lessons.findIndex(l=>!S.done[l.id]);if(i<0)i=W.preview?7:W.lessons.length;const r=svg.getBoundingClientRect(),H=W.img?W.img.h:1560,Y=W.img?W.img.nodes[i][1]:P[i][1],sc=r.height/H;return Math.max(0,window.scrollY+r.top+Y*sc-window.innerHeight*.55)}
$('#nStudio').href=STUDIO;
let rzT=0,lastW=innerWidth;addEventListener('resize',()=>{if(Math.abs(innerWidth-lastW)<8)return;lastW=innerWidth;clearTimeout(rzT);rzT=setTimeout(()=>{if(WORLDS[curW].img&&!$('#vMap').hidden)drawMap()},200)});
drawMap();requestAnimationFrame(()=>window.scrollTo(0,scrollCur()));


/* ===================== CLIMA: nubes, lluvia, nieve y sol con profundidad ===================== */
var WXC=document.getElementById('wx'),wctx=WXC.getContext('2d'),WXB=document.getElementById('wxb'),bctx=WXB.getContext('2d');
var WXM=WXM||'clouds',WP=[],WC=[],WW=0,WH=0,wLast=performance.now(),wT=0,WIND=0,DPR=1,CSPR=null,FSPR=null;
function wResize(){DPR=Math.min(2,devicePixelRatio||1);WW=WXC.width=WXB.width=Math.round(innerWidth*DPR);WH=WXC.height=WXB.height=Math.round(innerHeight*DPR);wSprites();wSeed()}
function wSprites(){
 // nube esponjosa: muchas manchas suaves sobre un lienzo aparte, para dibujarla rápido
 const cw=Math.round(520*DPR),ch=Math.round(240*DPR);CSPR=document.createElement('canvas');CSPR.width=cw;CSPR.height=ch;const c=CSPR.getContext('2d');
 const puff=(x,y,r,a)=>{const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(255,255,255,${a})`);g.addColorStop(.55,`rgba(255,255,255,${a*.55})`);g.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,7);c.fill()};
 let s=7;const rnd=()=>((s=(s*9301+49297)%233280)/233280);
 for(let i=0;i<26;i++){const t=i/25,x=cw*(.12+.76*t)+(rnd()-.5)*cw*.08,y=ch*(.58-.22*Math.sin(t*Math.PI))+(rnd()-.5)*ch*.12,r=ch*(.16+.2*Math.sin(t*Math.PI)+rnd()*.07);puff(x,y,r,.55)}
 for(let i=0;i<14;i++)puff(cw*(.2+.6*rnd()),ch*(.62+.1*rnd()),ch*(.12+.1*rnd()),.35);
 // copo suave
 const fs=Math.round(16*DPR);FSPR=document.createElement('canvas');FSPR.width=FSPR.height=fs;const f=FSPR.getContext('2d'),g=f.createRadialGradient(fs/2,fs/2,0,fs/2,fs/2,fs/2);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.35,'rgba(255,255,255,.85)');g.addColorStop(1,'rgba(255,255,255,0)');f.fillStyle=g;f.fillRect(0,0,fs,fs)}
function wSeed(){WP=[];WC=[];const r=Math.random;
 const nC=WXM==='sun'?0:WXM==='rain'?7:WXM==='snow'?5:6;
 for(let i=0;i<nC;i++){const front=i%3===0,z=front?.85+r()*.3:.45+r()*.4;WC.push({x:r()*WW*1.4-WW*.2,y:WH*(.12+r()*.8),s:z*(WW/(520*DPR))*(.7+r()*.5),v:(6+r()*8)*DPR*z,front,a:front?.28:.55})}
 if(WXM==='rain'){for(let i=0;i<220;i++){const z=r()*r()*.85+.15;WP.push({x:r()*WW*1.3,y:r()*WH,z,l:(8+26*z)*DPR,v:(520+900*z)*DPR})}}
 else if(WXM==='snow'){for(let i=0;i<170;i++){const z=r()*r()*.85+.15;WP.push({x:r()*WW,y:r()*WH,z,r:(1.2+4.2*z)*DPR,v:(14+60*z)*DPR,ph:r()*6.3,f:.4+r()*.9,amp:(8+30*z)*DPR})}}
 else if(WXM==='sun'){for(let i=0;i<55;i++){const z=r()*.8+.2;WP.push({x:r()*WW,y:r()*WH,z,r:(.8+2*z)*DPR,v:(8+26*z)*DPR,ph:r()*6.3})}}}
function setWeather(m){WXM=m;if(!wctx)return;wSeed();setTimeout(()=>wDraw(0),50)}
function wFade(ctx){// desvanece el efecto debajo del título y encima de la barra inferior
 const hb=$('.top')?$('.top').getBoundingClientRect().bottom*DPR:0,nt=$('.nav')?$('.nav').getBoundingClientRect().top*DPR:WH;ctx.save();ctx.globalCompositeOperation='destination-out';
 let g=ctx.createLinearGradient(0,hb-30*DPR,0,hb+70*DPR);g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,WW,hb+70*DPR);
 g=ctx.createLinearGradient(0,nt-70*DPR,0,nt+10*DPR);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,1)');ctx.fillStyle=g;ctx.fillRect(0,nt-70*DPR,WW,WH);ctx.restore()}
function drawClouds(ctx,front,dt,still){const tint=WXM==='rain'?'rgba(70,82,100,':WXM==='snow'?'rgba(225,235,248,':null;
 for(const c of WC){if(c.front!==front)continue;if(!still){c.x+=(c.v+WIND*12*DPR)*dt;const w=CSPR.width*c.s;if(c.x>WW+w*.2)c.x=-w*1.1}
  const w=CSPR.width*c.s,h=CSPR.height*c.s;ctx.globalAlpha=c.a;ctx.drawImage(CSPR,c.x,c.y-h/2,w,h);
  if(tint){ctx.globalCompositeOperation='source-atop';ctx.fillStyle=tint+(WXM==='rain'?.55:.25)+')';ctx.fillRect(c.x,c.y-h/2,w,h);ctx.globalCompositeOperation='source-over'}}ctx.globalAlpha=1}
function wDraw(dt){const still=matchMedia('(prefers-reduced-motion: reduce)').matches||dt===0;wT+=dt;
 wctx.clearRect(0,0,WW,WH);bctx.clearRect(0,0,WW,WH);if(!$('#vMap')||$('#vMap').hidden||!CSPR)return;
 WIND=.5*Math.sin(wT*.23)+.3*Math.sin(wT*.71+1.3);const d=DPR;
 drawClouds(bctx,false,dt,still);
 if(WXM==='sun'){const hb=$('.top')?$('.top').getBoundingClientRect().bottom*d:0,cx=WW*.88,cy=Math.max(hb+WH*.05,WH*.24),R=Math.max(WW,WH)*.75,pulse=still?1:.94+.06*Math.sin(wT*1.1);
  let g=bctx.createRadialGradient(cx,cy,0,cx,cy,R*pulse);g.addColorStop(0,'rgba(255,244,205,.85)');g.addColorStop(.06,'rgba(255,214,130,.55)');g.addColorStop(.3,'rgba(255,150,50,.18)');g.addColorStop(1,'rgba(255,120,30,0)');bctx.fillStyle=g;bctx.fillRect(0,0,WW,WH);
  wctx.save();wctx.globalCompositeOperation='lighter';g=wctx.createRadialGradient(cx,cy,0,cx,cy,R*.55);g.addColorStop(0,'rgba(255,220,150,.22)');g.addColorStop(1,'rgba(255,170,80,0)');wctx.fillStyle=g;wctx.fillRect(0,0,WW,WH);
  wctx.translate(cx,cy);wctx.rotate(still?0:wT*.02);for(let i=0;i<14;i++){wctx.rotate(Math.PI*2/14);const len=R*(.8+.25*Math.sin(i*1.7+wT*.4)),wd=R*(.025+.015*Math.sin(i*2.3));const rg=wctx.createLinearGradient(0,0,len,0);rg.addColorStop(0,'rgba(255,215,140,.10)');rg.addColorStop(1,'rgba(255,215,140,0)');wctx.fillStyle=rg;wctx.beginPath();wctx.moveTo(0,0);wctx.lineTo(len,-wd);wctx.lineTo(len,wd);wctx.closePath();wctx.fill()}wctx.restore();
  for(const p of WP){if(!still){p.y-=p.v*dt;p.ph+=dt*.8;p.x+=(Math.sin(p.ph)*10+WIND*6)*d*dt;if(p.y<-5){p.y=WH+5;p.x=Math.random()*WW}}wctx.globalAlpha=.25+.45*p.z;wctx.fillStyle='rgb(255,214,140)';wctx.beginPath();wctx.arc(p.x,p.y,p.r,0,7);wctx.fill()}wctx.globalAlpha=1}
 if(WXM==='rain'){const ang=.12+WIND*.12;wctx.lineCap='round';
  for(const p of WP){if(!still){p.y+=p.v*dt;p.x-=p.v*dt*ang;if(p.y-p.l>WH){p.y=-Math.random()*WH*.2;p.x=Math.random()*WW*1.3}if(p.x<-40)p.x+=WW*1.3}
   const tx=p.x+p.l*ang,ty=p.y-p.l,g=wctx.createLinearGradient(tx,ty,p.x,p.y);g.addColorStop(0,'rgba(200,215,235,0)');g.addColorStop(1,`rgba(205,220,240,${.12+.45*p.z})`);wctx.strokeStyle=g;wctx.lineWidth=(.5+1.1*p.z)*d;wctx.beginPath();wctx.moveTo(tx,ty);wctx.lineTo(p.x,p.y);wctx.stroke()}
  bctx.fillStyle='rgba(18,26,44,.16)';bctx.fillRect(0,0,WW,WH)}
 if(WXM==='snow'){for(const p of WP){if(!still){p.y+=p.v*dt;p.ph+=dt*p.f;p.x+=(Math.sin(p.ph)*p.amp*.9+WIND*(10+25*p.z)*d)*dt;if(p.y>WH+10){p.y=-10;p.x=Math.random()*WW}if(p.x>WW+10)p.x=-10;if(p.x<-10)p.x=WW+10}
   const sz=p.r*2*(p.z>.8?1.25:1);wctx.globalAlpha=.35+.6*p.z;wctx.drawImage(FSPR,p.x-sz/2,p.y-sz/2,sz,sz)}wctx.globalAlpha=1}
 drawClouds(wctx,true,dt,still);
 wFade(wctx);wFade(bctx)}
addEventListener('resize',wResize);wResize();setTimeout(()=>wDraw(0),100);
(function wLoop(t){requestAnimationFrame(wLoop);const dt=Math.min(.05,(t-wLast)/1000)||0;wLast=t;wDraw(dt||.016)})(performance.now());

const cv=$('#dust'),cx=cv.getContext('2d');let DW,DH,parts=[];
function rs(){DW=cv.width=innerWidth*devicePixelRatio;DH=cv.height=innerHeight*devicePixelRatio;parts=Array.from({length:40},()=>({x:Math.random()*DW,y:Math.random()*DH,r:(Math.random()*1.6+.4)*devicePixelRatio,s:Math.random()*.25+.05,a:Math.random()*6}))}rs();addEventListener('resize',rs);
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
(function tick(){cx.clearRect(0,0,DW,DH);for(const p of parts){if(!still){p.y-=p.s*devicePixelRatio;p.a+=.01;p.x+=Math.sin(p.a)*.2;if(p.y<-5){p.y=DH+5;p.x=Math.random()*DW}}cx.globalAlpha=.3+.3*Math.sin(p.a*2);cx.fillStyle=dustColor;cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fill()}if(!still)requestAnimationFrame(tick)})();
})();
