<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d1226"><style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}[hidden]{display:none!important}</style></head><body><title>Mont Keys Aprender</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
/* Layout: app de una sola pantalla con tres vistas (Mapa, Lección, Pasaporte). Tema nocturno único; cada mundo cambia el acento. */
:root{
  --night:#0d1226; --panel:#151a30; --line:rgba(241,230,207,.14); --parch:#f1e6cf; --muted:#b7ab98; --ink:#1b1712;
  --gold:#e8c27a; --gold-deep:#9c7432; --wax:#8e2b2b; --ok:#5fd0a4; --bad:#ef6b6b; --acc:#e8c27a;
  --display:'Cinzel',Georgia,serif; --body:'Alegreya Sans',system-ui,sans-serif; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;background:var(--night);color:var(--parch)}
body{font:16px/1.5 var(--body);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--night);z-index:60}
button{font-family:var(--body);color:inherit}
.view{min-height:100%}
#sky{position:fixed;inset:0;z-index:0;transition:background 1s}
#dust{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto}
/* cabecera del mapa */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding-block:10px 14px;background:linear-gradient(180deg,rgba(11,16,36,.97),rgba(11,16,36,.8) 70%,rgba(11,16,36,0))}
.toprow{display:flex;align-items:center;gap:10px}
.wnav{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:rgba(13,18,38,.6);display:grid;place-items:center;cursor:pointer}
.wnav[disabled]{opacity:.3;cursor:default}
.wtitle{flex:1;min-width:0;text-align:center}
.eyebrow{font:500 11px var(--display);letter-spacing:.2em;color:var(--acc);text-transform:uppercase}
h1{font:700 clamp(18px,5.2vw,23px)/1.15 var(--display);margin:2px 0 0;text-wrap:balance}
.tag{font-size:13px;color:var(--muted);font-style:italic}
.stats{display:flex;justify-content:center;gap:8px;margin-top:8px}
.pill{display:flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;border:1px solid rgba(232,194,122,.3);background:rgba(13,18,38,.6);font:700 13px var(--body);font-variant-numeric:tabular-nums;color:var(--gold)}
.pill svg{width:13px;height:13px}
main{position:relative;z-index:2}
#map{width:100%;max-width:560px;display:block;margin:0 auto}
.node{cursor:pointer}.node:focus{outline:none}.node:focus-visible .ring{stroke:#fff;stroke-width:3}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{opacity:.75;transform:scale(1)}100%{opacity:0;transform:scale(1.9)}}
.float{animation:float 7s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.flick{animation:flick 1.6s ease-in-out infinite alternate}@keyframes flick{from{opacity:.5}to{opacity:1}}
.banner{margin:6px auto 0;max-width:560px;font-size:13px;color:var(--parch);background:rgba(13,18,38,.75);border:1px solid var(--line);border-radius:12px;padding:8px 12px;text-align:center}
/* barra inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;padding-block:8px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(9,12,26,.94);border-top:1px solid var(--line);backdrop-filter:blur(6px)}
.navrow{display:flex;justify-content:space-around;max-width:560px;margin:0 auto}
.nav button,.nav a{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font:700 12px var(--body);color:var(--muted);cursor:pointer;text-decoration:none;padding:4px}
.nav [aria-current="true"]{color:var(--gold)}
.nav svg{width:22px;height:22px}
.spacer{height:calc(78px + env(safe-area-inset-bottom,0px))}
/* hoja */
#scrim{position:fixed;inset:0;background:rgba(5,7,16,.6);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}#sheet.on{transform:none}
.card{max-width:560px;margin:0 auto;background:linear-gradient(180deg,#f4ead5,#e8d9b9);color:var(--ink);border-radius:18px;padding:18px;box-shadow:0 -10px 40px rgba(0,0,0,.45);border:1px solid #c9b48a;display:flex;flex-direction:column;gap:10px;max-height:82vh;overflow:auto}
.card .eyebrow{color:#8a5a22}.card h2{font:700 21px/1.2 var(--display);margin:0;text-wrap:balance}.card p{margin:0;color:#3a3127}
.steps4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.step4{background:rgba(27,23,18,.06);border:1px solid rgba(27,23,18,.12);border-radius:10px;padding:7px 4px;text-align:center;font-size:12px;font-weight:700;color:#4a3d2c}
.step4 span{display:block;font:500 10px var(--display);letter-spacing:.12em;color:#8a5a22}
.cta{border:0;border-radius:12px;padding:13px;font:800 16px var(--body);background:var(--wax);color:#fbeee0;cursor:pointer;width:100%}
.cta.gold{background:linear-gradient(180deg,#f0cf8a,#c99a48);color:#2b1d08}
.cta[disabled]{background:#9a8f80;color:#eee;cursor:default}
.ghost{border:1px solid currentColor;background:transparent;border-radius:12px;padding:11px;font:700 15px var(--body);cursor:pointer;width:100%}
.cta:focus-visible,.ghost:focus-visible,.opt:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.small{font-size:13px;color:#5b4a33}
/* lección */
#vLesson{position:fixed;inset:0;z-index:50;background:radial-gradient(120% 80% at 50% 0%,#1d2342,#0d1226 60%);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.lhead{display:flex;align-items:center;gap:12px;padding-block:12px}
.lx{width:34px;height:34px;flex:none;border-radius:50%;border:1px solid var(--line);background:none;cursor:pointer;display:grid;place-items:center}
.lbar{flex:1;height:10px;border-radius:6px;background:rgba(241,230,207,.12);overflow:hidden}.lbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold-deep),var(--gold));transition:width .4s}
.lphase{font:500 11px var(--display);letter-spacing:.18em;color:var(--acc);text-transform:uppercase}
.lbody{flex:1;overflow:auto;display:flex;flex-direction:column;gap:14px;padding-block:6px 14px}
.lfoot{padding-block:10px 14px}
.lq{font:700 21px/1.25 var(--body);margin:0;text-wrap:balance}
.ltext{font-size:17px;line-height:1.55;color:#e7dcc6;margin:0;max-width:62ch}
.art{border-radius:16px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(232,194,122,.1),rgba(232,194,122,.02));display:grid;place-items:center;min-height:150px;padding:12px}
.art svg{width:100%;max-width:300px;height:auto}
.fact{border-left:3px solid var(--acc);padding:8px 12px;background:rgba(232,194,122,.08);border-radius:0 10px 10px 0;font-size:15px;color:#e7dcc6}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:rgba(241,230,207,.04);border-radius:14px;padding:13px 14px;font:600 16px var(--body);cursor:pointer}
.opt.sel{border-color:var(--gold)}.opt.ok{border-color:var(--ok);background:rgba(95,208,164,.14)}.opt.bad{border-color:var(--bad);background:rgba(239,107,107,.12)}
.fb{border-radius:14px;padding:12px 14px;font-size:15px;display:none}.fb.on{display:block}
.fb.ok{background:rgba(95,208,164,.15);border:1px solid rgba(95,208,164,.5)}.fb.bad{background:rgba(239,107,107,.13);border:1px solid rgba(239,107,107,.45)}
.fb b{display:block;font-size:16px;margin-bottom:2px}
/* teclado */
.kb{position:relative;height:150px;user-select:none;-webkit-user-select:none;touch-action:none;border-radius:10px;overflow:hidden;background:#111;border:1px solid #000}
.kw{position:absolute;top:0;bottom:0;background:linear-gradient(180deg,#fdfbf6,#ece4d2);border-right:1px solid #9c9282;border-radius:0 0 6px 6px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font:700 11px var(--body);color:#6b6152}
.kbk{position:absolute;top:0;height:60%;background:linear-gradient(180deg,#2a2622,#0e0c0a);border-radius:0 0 4px 4px;z-index:2;box-shadow:0 2px 3px rgba(0,0,0,.5)}
.kw.hit,.kbk.hit{background:var(--gold)!important}.kw.good,.kbk.good{background:var(--ok)!important}.kw.wrong,.kbk.wrong{background:var(--bad)!important}.kw.hint{box-shadow:inset 0 -6px 0 var(--acc)}
.kbk.hint{box-shadow:inset 0 -6px 0 var(--acc)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chipb{border:1px solid var(--line);background:rgba(241,230,207,.05);border-radius:999px;padding:6px 12px;font:700 13px var(--body);cursor:pointer}
.chipb[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.meter{height:10px;border-radius:6px;background:rgba(241,230,207,.12);overflow:hidden}.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5fd0a4,#ffd56e 70%,#ef6b6b)}
.big{font:800 34px var(--display);text-align:center;color:var(--gold);margin:0}
.notes{display:flex;gap:6px;flex-wrap:wrap;min-height:34px}
.nchip{border-radius:8px;padding:4px 9px;background:rgba(232,194,122,.16);border:1px solid rgba(232,194,122,.4);font:700 14px var(--body)}
.tapbtn{height:120px;border-radius:24px;border:2px solid var(--gold);background:rgba(232,194,122,.12);font:800 22px var(--display);color:var(--gold);cursor:pointer;touch-action:manipulation;width:100%}
.tapbtn:active{background:rgba(232,194,122,.3)}
.done{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.stars{display:flex;gap:10px}.stars svg{width:48px;height:48px}
.acard{width:100%;background:linear-gradient(180deg,#f4ead5,#e3d1ac);color:var(--ink);border-radius:16px;padding:14px;text-align:left;border:1px solid #c9b48a;display:flex;flex-direction:column;gap:6px}
.acard h3{font:700 18px var(--display);margin:0}.acard .per{font-size:13px;color:#7a5a2a;font-weight:700}.acard p{margin:0;color:#3a3127;font-size:15px}
/* pasaporte */
.pass{position:relative;z-index:2;padding-block:16px 20px;display:flex;flex-direction:column;gap:18px}
.pass h2{font:700 22px var(--display);margin:0}
.stamps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stamp{aspect-ratio:1;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;text-align:center;font:700 10px var(--display);letter-spacing:.08em;color:var(--muted);padding:6px}
.stamp.on{border:3px double var(--sc);color:var(--sc);transform:rotate(-8deg);background:rgba(255,255,255,.03)}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.aitem{border-radius:14px;border:1px solid var(--line);background:rgba(241,230,207,.05);padding:12px;text-align:left;cursor:pointer;font:600 14px var(--body)}
.aitem small{display:block;color:var(--muted);font-weight:500}
.aitem.lock{opacity:.4;cursor:default}
.comp{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:rgba(241,230,207,.04)}
.comp b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{border:1px solid var(--line);background:none;border-radius:10px;padding:7px 10px;font:700 13px var(--body);cursor:pointer}
.empty{color:var(--muted);font-size:15px}
@media (prefers-reduced-motion:reduce){.pulse,.float,.flick{animation:none}#sheet,#scrim,.lbar i{transition:none}}
</style>

<div id="sky"></div>
<canvas id="dust"></canvas>

<section class="view" id="vMap">
  <header class="top gut"><div class="wrap">
    <div class="toprow">
      <button class="wnav" id="wPrev" type="button" aria-label="Mundo anterior"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>

      <span class="pill" title="Racha de días"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z"/></svg><span id="sStreak">0</span></span>

    <div><p class="eyebrow" style="margin:0 0 8px">Archivo de descubrimientos</p><div class="agrid" id="archive"></div></div>

    <button class="ghost" type="button" id="resetAll" style="color:var(--muted)">Borrar mi progreso de este teléfono</button>
  </div></div>

</section>

  <div class="gut"><div class="wrap lhead"><button class="lx" id="lClose" type="button" aria-label="Salir de la lección"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div class="lbar"><i id="lBar"></i></div></div></div>
  <div class="lbody gut"><div class="wrap" id="lStage" style="display:flex;flex-direction:column;gap:14px"></div></div>

</section>

<nav class="nav gut"><div class="navrow">
  <button type="button" id="nMap" aria-current="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M9 4l6 2 6-2v16l-6 2-6-2-6 2V6z"/><path d="M9 4v16M15 6v16"/></svg>Mapa</button>
  <button type="button" id="nPass"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="12" cy="10" r="3"/><path d="M8 17h8"/></svg>Pasaporte</button>
  <a href="../" id="nStudio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 6v7M11 6v7M15 6v7M19 6v7"/></svg>Estudio</a>
</div></nav>

<div id="sheet" role="dialog" aria-modal="true"><div class="gut"><div class="card" id="card"></div></div></div>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const NAMES=['Do','Do♯','Re','Re♯','Mi','Fa','Fa♯','Sol','Sol♯','La','La♯','Si'];
const LET=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const isBlack=p=>[1,3,6,8,10].includes(((p%12)+12)%12);
const nm=p=>NAMES[p%12];
const nmOct=p=>NAMES[p%12]+(Math.floor(p/12)-1);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ===================== MUNDOS Y CONTENIDO ===================== */
const W1={id:'w1',num:'I',place:'Firenze',name:'El Renacimiento italiano',tag:'Donde la música encontró una nueva voz',
 sky:'linear-gradient(180deg,#0b1024 0%,#1c1d3c 30%,#3b2a48 58%,#7a4240 80%,#c06d3c 100%)',acc:'#e8c27a',
 pal:{top:['#b9a07c','#8f7556'],cliff:['#5b4a3b','#1e1915'],mid:'#4e4033',house:'#d9c3a0',houseSh:'#b89f7c',roof:'#b35a36',roofSh:'#8a4229',tree:'#1f2e22',tree2:'#2c4230',plaza:'#cdb48c',cloud:'#e9b48a',rim:'#f6c27a',dust:'#ffd99a'},
 landmark:'duomo',stampColor:'#e8c27a',
 img:{src:'w1.jpg',w:768,h:1376,nodes:[[385,1212],[497,1088],[273,910],[411,768],[277,640],[466,521],[293,407],[385,250]],chest:[335,848]},
 lessons:[
 {id:'w1l1',t:'La ciudad de la música',d:'Qué es el sonido, cómo lo producen los instrumentos y cómo vivía la música antes de poder grabarla.',
  disc:{id:'a-florencia',name:'La vida musical en Florencia',per:'Renacimiento · siglos XV y XVI',text:'En la Florencia de los Médici la música sonaba en iglesias, en la corte, en fiestas públicas y en las casas de las familias ricas. Los músicos aprendían de un maestro y la música se conservaba en la memoria y en manuscritos copiados a mano.',sig:'Sin grabaciones, cada interpretación era única: la música solo existía mientras alguien la tocaba.'},
  steps:[
   {type:'story',ph:'Descubrir',art:'city',title:'Bienvenido a Florencia',text:'Hace más de quinientos años, Florencia era una de las ciudades más ricas de Europa. La música sonaba en las iglesias, en la corte de los Médici, en las plazas durante las fiestas y en los talleres donde se fabricaban instrumentos.',fact:'No existía ninguna forma de grabar sonido: la primera grabación de sonido llegaría en el siglo XIX.'},
   {type:'story',ph:'Aprender',art:'wave',title:'¿Qué es el sonido?',text:'Todo sonido empieza con algo que vibra: una cuerda, una membrana, el aire dentro de una flauta. Esa vibración empuja el aire, el aire la lleva hasta nosotros y el oído la convierte en lo que percibimos como sonido. También se puede sentir: apoya la mano sobre un piano mientras suena.',fact:'Vibración rápida = sonido agudo. Vibración lenta = sonido grave.'},
   {type:'choice',ph:'Aprender',q:'¿Qué necesita el sonido para viajar hasta nosotros?',opts:['Un medio que vibre, como el aire','Luz','Electricidad'],a:0,why:'El sonido es vibración que viaja por un medio: aire, agua, madera… En el vacío no hay sonido.'},
   {type:'choice',ph:'Aprender',q:'Antes de que existieran las grabaciones, ¿cómo se conservaba la música?',opts:['En discos de piedra','En la memoria de los músicos y en manuscritos copiados a mano','No se conservaba de ninguna forma'],a:1,why:'Los músicos aprendían de memoria con sus maestros, y parte de la música se escribía a mano en manuscritos.'},
   {type:'free',ph:'Tocar',q:'Toca dos notas graves',sub:'Las teclas graves están a la izquierda. Mira cómo la onda vibra más despacio.',side:'low',count:2,lo:48,hi:72},
   {type:'free',ph:'Tocar',q:'Ahora dos notas agudas',sub:'Las agudas están a la derecha: vibran más rápido.',side:'high',count:2,lo:48,hi:72},
   {type:'create',ph:'Crear',q:'Tu primer sonido en Florencia',sub:'Toca tres notas, las que quieras, y escucha tu pequeña idea musical.',len:3,lo:55,hi:76}
  ]},
 {id:'w1l2',t:'Los instrumentos olvidados',d:'El clavecín y el clavicordio: cómo suenan, cómo funcionan y por qué no se podía tocar fuerte o suave a voluntad.',
  disc:{id:'a-clavecin',name:'El clavecín',per:'Usado sobre todo entre los siglos XVI y XVIII',text:'Instrumento de teclado en el que cada tecla acciona una pieza que pulsa la cuerda con una púa, tradicionalmente de pluma de ave. Las primeras menciones de instrumentos de este tipo aparecen hacia finales del siglo XIV.',sig:'Pulsar la cuerda da casi el mismo volumen sin importar la fuerza del dedo: por eso los músicos soñaban con un teclado expresivo.'},
  steps:[
   {type:'story',ph:'Descubrir',art:'harpsi',title:'El clavecín',text:'Antes del piano, el gran instrumento de teclado era el clavecín. Al bajar una tecla, una pequeña púa sube y pellizca la cuerda, como cuando tocas una guitarra con los dedos. Su sonido es brillante y metálico.',fact:'Toques fuerte o suave, el clavecín suena prácticamente igual de fuerte.'},
   {type:'story',ph:'Descubrir',art:'clavi',title:'El clavicordio',text:'El clavicordio era más íntimo: una pequeña lámina de metal (la tangente) golpea la cuerda y se queda tocándola mientras mantienes la tecla. Permitía matices de volumen, pero su sonido era tan suave que casi solo servía para estudiar en una habitación.',fact:'Con el clavicordio se podía hacer un ligero vibrato moviendo el dedo sobre la tecla.'},
   {type:'choice',ph:'Aprender',q:'¿Cómo produce el sonido el clavecín?',opts:['Un martillo golpea la cuerda','Una púa pellizca la cuerda','Un arco frota la cuerda'],a:1,why:'En el clavecín, una púa pulsa (pellizca) la cuerda.'},
   {type:'compare',ph:'Aprender',q:'Mira y escucha la misma nota tocada suave y fuerte',a:'harpsi',b:'piano',why:'En el clavecín las dos ondas son casi iguales. En el piano, la nota fuerte es mucho más grande.'},
   {type:'choice',ph:'Aprender',q:'¿Cuál era la gran limitación del clavecín?',opts:['No podía tocar notas agudas','No permitía tocar más fuerte o más suave según la fuerza del dedo','Era demasiado fuerte'],a:1,why:'Esa limitación es la que intentaría resolver Bartolomeo Cristofori.'},
   {type:'choice',ph:'Aprender',q:'¿Para qué se usaba sobre todo el clavicordio?',opts:['Para tocar en grandes catedrales','Para estudiar y tocar en espacios pequeños','Para acompañar desfiles'],a:1,why:'Su sonido era muy suave: ideal para practicar en casa, no para grandes salas.'}
  ]},
 {id:'w1l3',t:'El nacimiento del piano',d:'Bartolomeo Cristofori y su mecanismo de martillos, hacia 1700: el «gravicembalo col piano e forte».',
  disc:{id:'a-cristofori',name:'El piano de Cristofori',per:'Florencia · hacia 1700',text:'Bartolomeo Cristofori (1655–1731), constructor de instrumentos al servicio de Fernando de Médici, creó un teclado en el que martillos golpean las cuerdas. Un inventario de los Médici del año 1700 ya lo describe. El piano más antiguo que se conserva es suyo y data de 1720 (Museo Metropolitano de Nueva York).',sig:'Por primera vez, la fuerza del dedo controlaba el volumen: había nacido el «gravicembalo col piano e forte».'},
  steps:[
   {type:'story',ph:'Descubrir',art:'cristofori',title:'Bartolomeo Cristofori',text:'Cristofori era un constructor de instrumentos nacido en Padua que trabajaba en Florencia para el príncipe Fernando de Médici. Hacia 1700 terminó un instrumento nuevo: en lugar de pellizcar la cuerda, un pequeño martillo la golpeaba y rebotaba enseguida, dejándola vibrar.',fact:'Lo llamaron «gravicembalo col piano e forte»: clavecín con suave y fuerte. De ahí viene la palabra «piano».'},
   {type:'story',ph:'Aprender',art:'dyn',title:'Piano y forte',text:'Con el martillo, cuanto más rápido baja el dedo, más fuerte golpea y más fuerte suena. En música, «piano» (p) significa suave y «forte» (f) significa fuerte. A esto lo llamamos dinámica: no solo importa qué nota tocas, sino cómo la tocas.',fact:'Matices: pp (muy suave) · p · mp · mf · f · ff (muy fuerte).'},
   {type:'choice',ph:'Aprender',q:'¿Qué podía hacer el piano de Cristofori que el clavecín no?',opts:['Tocar más notas a la vez','Sonar suave o fuerte según la fuerza del dedo','Afinarse solo'],a:1,why:'El mecanismo de martillos permitía controlar el volumen con el toque.'},
   {type:'choice',ph:'Aprender',q:'En música, ¿qué significa «forte»?',opts:['Rápido','Suave','Fuerte'],a:2,why:'Forte = fuerte. Piano = suave.'},
   {type:'dyn',ph:'Tocar',q:'Toca con dinámica',sub:'En este teclado, tocar cerca de la punta de la tecla (abajo) suena fuerte y cerca del fondo (arriba) suena suave. Mira el medidor.',items:['p','f','p','f']},
   {type:'create',ph:'Crear',q:'Un eco: fuerte y luego suave',sub:'Toca 4 notas: las dos primeras forte y las dos últimas piano, como un eco.',len:4,lo:55,hi:76,dyn:true}
  ]},
 {id:'w1l4',t:'Las siete teclas',d:'Do, Re, Mi, Fa, Sol, La, Si. Los grupos de teclas negras, encontrar el Do, graves y agudos.',
  disc:{id:'a-utremi',name:'Ut, re, mi: los nombres de las notas',per:'Siglo XI en adelante',text:'Guido d’Arezzo usó las sílabas iniciales de los versos del himno «Ut queant laxis» (ut, re, mi, fa, sol, la) para enseñar a cantar. Más tarde «ut» se cambió por «do» (un cambio que suele atribuirse a Giovanni Battista Doni, en el siglo XVII) y se añadió «si».',sig:'En los países latinos usamos Do-Re-Mi; en los anglosajones, letras: C D E F G A B.'},
  steps:[
   {type:'story',ph:'Descubrir',art:'utremi',title:'Siete nombres que se repiten',text:'Las teclas blancas tienen solo siete nombres: Do, Re, Mi, Fa, Sol, La, Si. Después de Si vuelve a empezar Do, más agudo. Este patrón se repite a lo largo de todo el teclado.',fact:'En inglés las notas se nombran con letras: C (Do), D (Re), E (Mi), F (Fa), G (Sol), A (La), B (Si).'},
   {type:'story',ph:'Aprender',art:'groups',title:'Los grupos de teclas negras',text:'Las teclas negras están en grupos de dos y de tres. Son tu mapa: el Do siempre está justo a la izquierda del grupo de dos teclas negras, y el Fa justo a la izquierda del grupo de tres.',fact:'Truco: Do = antes del grupo de 2. Fa = antes del grupo de 3.'},
   {type:'keys',ph:'Tocar',lo:48,hi:72,labels:false,items:[{say:'Encuentra un Do',pc:0},{say:'Encuentra otro Do',pc:0,notSame:true},{say:'Encuentra un Fa',pc:5},{say:'Ahora un Re',pc:2},{say:'Encuentra Sol',pc:7},{say:'Encuentra Mi',pc:4},{say:'Encuentra La',pc:9},{say:'Y por último, Si',pc:11}]},
   {type:'choice',ph:'Aprender',q:'¿Cuántos nombres distintos tienen las teclas blancas?',opts:['5','7','12'],a:1,why:'Siete: Do, Re, Mi, Fa, Sol, La, Si. Luego se repiten.'},
   {type:'choice',ph:'Aprender',q:'En el sistema de letras, ¿qué nota es la G?',opts:['Re','Sol','La'],a:1,why:'C D E F G A B = Do Re Mi Fa Sol La Si. G es Sol.'},
   {type:'keys',ph:'Tocar',lo:36,hi:84,labels:false,items:[{say:'Toca el Do más grave que veas',exact:36},{say:'Ahora el Do más agudo',exact:84}]},
   {type:'create',ph:'Crear',q:'Tu primera melodía',sub:'Escribe una melodía de 4 notas usando solo teclas blancas. Puedes probar todas las veces que quieras.',len:4,lo:60,hi:72,white:true,save:true}
  ]},
 {id:'w1l5',t:'El lenguaje de la música',d:'El pentagrama, la clave de Sol y la de Fa, y cómo cada nota escrita corresponde a una tecla.',
  disc:{id:'a-guido',name:'Guido d’Arezzo',per:'Monje italiano · nacido hacia el año 991',text:'Maestro de música que ideó un sistema de líneas separadas por terceras para escribir la altura exacta de las notas, la base de nuestro pentagrama, y un método con sílabas para aprender a cantar. Lo explicó en su tratado «Micrologus», escrito hacia 1025.',sig:'Gracias a su sistema, un cantante podía aprender una melodía nueva leyendo, sin oírla antes.'},
  steps:[
   {type:'story',ph:'Descubrir',art:'staff',title:'Escribir el sonido',text:'Durante siglos la música se aprendía de oído. En el siglo XI, un monje llamado Guido d’Arezzo perfeccionó una idea: dibujar líneas horizontales y colocar las notas sobre ellas y entre ellas, para mostrar exactamente lo alto o lo bajo que suena cada una.',fact:'Hoy usamos cinco líneas: el pentagrama.'},
   {type:'story',ph:'Aprender',art:'clefs',title:'Las claves',text:'El pentagrama tiene 5 líneas y 4 espacios. Al principio va una clave que dice dónde está cada nota. La clave de Sol se enrosca en la segunda línea: esa línea es el Sol. La clave de Fa marca con sus dos puntos la cuarta línea: el Fa. La mano derecha suele leer en clave de Sol y la izquierda en clave de Fa.',fact:'El Do central está en una línea adicional, justo debajo del pentagrama en clave de Sol.'},
   {type:'choice',ph:'Aprender',q:'¿Cuántas líneas tiene el pentagrama?',opts:['4','5','6'],a:1,why:'Penta = cinco. Cinco líneas y cuatro espacios.'},
   {type:'staff',ph:'Tocar',clef:'G',lo:57,hi:79,items:[67,60,64,72,69,65]},
   {type:'staff',ph:'Tocar',clef:'F',lo:38,hi:62,items:[53,48,55,43]},
   {type:'choice',ph:'Aprender',q:'¿Qué nota marca la clave de Sol?',opts:['La nota de la segunda línea','La nota del primer espacio','La nota más aguda'],a:0,why:'La clave de Sol indica que la segunda línea (contando desde abajo) es Sol.'}
  ]},
 {id:'w1l6',t:'El pulso del tiempo',d:'Pulso y tempo; redondas, blancas, negras y corcheas; compases de 4/4 y 3/4.',
  disc:{id:'a-mensural',name:'La notación mensural',per:'Europa · siglos XIII a XVI',text:'Sistema para escribir la duración de las notas con figuras de distintas formas. Uno de sus textos más influyentes es el «Ars cantus mensurabilis», atribuido a Franco de Colonia y escrito hacia 1260.',sig:'De estas figuras medievales vienen las redondas, blancas y negras que usamos hoy.'},
  steps:[
   {type:'story',ph:'Descubrir',art:'pulse',title:'El pulso',text:'Casi toda la música tiene un pulso regular, como los latidos del corazón. Cuando alguien da palmas o mueve el pie con una canción, está siguiendo el pulso. El tempo es la velocidad de ese pulso y se mide en pulsos por minuto (BPM).',fact:'60 BPM = un pulso por segundo.'},
   {type:'story',ph:'Aprender',art:'figures',title:'Las figuras',text:'La duración de cada nota se escribe con figuras. En un compás de 4/4: la redonda dura 4 pulsos, la blanca 2, la negra 1 y la corchea medio pulso (dos corcheas por pulso).',fact:'4/4: cuatro negras por compás. 3/4: tres negras por compás, como un vals.'},
   {type:'choice',ph:'Aprender',q:'¿Cuántas negras caben en una blanca?',opts:['1','2','4'],a:1,why:'La blanca dura 2 pulsos y la negra 1.'},
   {type:'choice',ph:'Aprender',q:'¿Cuántos pulsos tiene un compás de 3/4?',opts:['3','4','6'],a:0,why:'El número de arriba indica cuántos pulsos hay: 3.'},
   {type:'rhythm',ph:'Tocar',q:'Sigue el pulso',sub:'Después de 4 pulsos de preparación, toca el botón en cada negra.',bpm:80,bars:2,beats:4,pattern:[0,1,2,3,4,5,6,7]},
   {type:'rhythm',ph:'Tocar',q:'Negra, negra, blanca',sub:'Toca al empezar cada nota. La blanca dura dos pulsos: no toques en el cuarto.',bpm:80,bars:2,beats:4,pattern:[0,1,2,4,5,6]},
   {type:'rhythm',ph:'Tocar',q:'Ahora corcheas',sub:'Dos toques por pulso en los dos primeros pulsos, luego dos negras.',bpm:70,bars:2,beats:4,pattern:[0,.5,1,1.5,2,3,4,4.5,5,5.5,6,7]}
  ]},
 {id:'w1l7',t:'Tu primera composición',d:'Une las siete notas, una melodía y un ritmo, y guárdala en tu estudio.',
  disc:{id:'a-obra',name:'Tu primera obra',per:'Hoy',text:'Una melodía tuya, escrita con las notas y las figuras que aprendiste en Florencia.',sig:'Componer es elegir: qué notas, cuánto dura cada una y dónde respira la melodía.'},
  steps:[
   {type:'story',ph:'Descubrir',art:'quill',title:'De aprendiz a compositor',text:'Ya sabes encontrar las notas, leerlas y medir su duración. Componer es unir esas tres cosas para decir algo propio. No hay una respuesta correcta: hay decisiones.',fact:'Consejo: una melodía suele sonar «terminada» si acaba en la misma nota con la que empezó.'},
   {type:'choice',ph:'Aprender',q:'¿Qué hace que una melodía suene más tranquila o más inquieta?',opts:['Solo las notas que elijas','Muchas cosas juntas: notas, ritmo, velocidad, dinámica y contexto','Que sea mayor o menor, siempre'],a:1,why:'No hay una regla única: el carácter nace de la combinación de elementos y del contexto.'},
   {type:'create',ph:'Crear',q:'Compón tu melodía',sub:'Escribe 8 notas. Elige la figura (negra o blanca) antes de tocar cada nota. Escúchala y, cuando te guste, guárdala.',len:8,lo:60,hi:77,durations:true,save:true,title:'Mi primera composición'}

 keys(st,box){let k=0,used=-1,errs=0;box.innerHTML=head(st.ph,'')+`<p class="big" id="kq"></p><div id="kbh"></div><div class="row"><button class="chipb" type="button" id="lab" aria-pressed="false">Ver nombres</button><button class="chipb" type="button" id="micb" aria-pressed="false">🎤 Usar mi piano</button></div><div class="fb" id="fb"></div>`;
  let busy=false;const ask=()=>{busy=false;if(k>=st.items.length)return;$('#kq').textContent=st.items[k].say;$('#fb').className='fb'};let labels=false;

 staff(st,box){let k=0;box.innerHTML=head(st.ph,'¿Qué nota es?','Toca en el teclado la nota que ves en el pentagrama.')+`<div class="art" id="stf"></div><div id="kbh"></div><div class="row"><button class="chipb" type="button" id="lab" aria-pressed="false">Ver nombres</button></div><div class="fb" id="fb"></div>`;let labels=false,kbd;

 free(st,box){let n=0;box.innerHTML=head(st.ph,st.q,st.sub)+`<div class="art"><svg id="wv" viewBox="0 0 300 90"><path id="wp" d="M0 45H300" stroke="#e8c27a" stroke-width="3" fill="none"/></svg></div><div id="kbh"></div><div class="fb" id="fb"></div>`;

 dyn(st,box){let k=0;box.innerHTML=head(st.ph,st.q,st.sub)+`<p class="big" id="dq"></p><div class="meter"><i id="dm"></i></div><div id="kbh"></div><div class="fb" id="fb"></div>`;

 rhythm(st,box){box.innerHTML=head(st.ph,st.q,st.sub)+`<div class="art"><svg viewBox="0 0 320 90" id="rt"></svg></div><p class="big" id="rc" style="font-size:26px">Listo</p><button class="tapbtn" type="button" id="tap" disabled>Toca aquí</button><div class="fb" id="fb"></div>`;
  const beats=st.bars*st.beats,bl=60/st.bpm,X=b=>16+b/beats*288;let svgs=`<path d="M16 50H304" stroke="rgba(241,230,207,.3)" stroke-width="2"/>`;for(let b=0;b<=beats;b++)svgs+=`<path d="M${X(b)} ${b%st.beats===0?30:40}V${b%st.beats===0?70:60}" stroke="rgba(241,230,207,${b%st.beats===0?.6:.25})" stroke-width="${b%st.beats===0?2:1}"/>`;
  st.pattern.forEach((p,i)=>svgs+=`<circle id="rp${i}" cx="${X(p)}" cy="50" r="7" fill="#e8c27a"/>`);svgs+=`<path id="rh" d="M16 22V78" stroke="#fff" stroke-width="2" opacity="0"/>`;$('#rt').innerHTML=svgs;
  let t0=0,taps=[],run=false,raf=0;

   const extra=taps.length-used.size,pct=Math.round(hits/st.pattern.length*100),okAll=hits>=st.pattern.length*.75&&extra<=2;const fb=$('#fb');fb.className='fb on '+(okAll?'ok':'bad');

 create(st,box){const notes=[];let dur=1,dynF=true;box.innerHTML=head(st.ph,st.q,st.sub)+`${st.durations?'<div class="row"><span class="small" style="color:var(--muted)">Figura:</span><button class="chipb" type="button" data-d="1" aria-pressed="true">♩ negra</button><button class="chipb" type="button" data-d="2" aria-pressed="false">𝅗𝅥 blanca</button></div>':''}<div class="notes" id="nl"></div><div id="kbh"></div><div class="row"><button class="chipb" type="button" id="pl">▶ Escuchar</button><button class="chipb" type="button" id="un">↶ Borrar última</button><button class="chipb" type="button" id="cl">Empezar de nuevo</button></div><div class="fb" id="fb"></div>`;

function saveComp(title,notes){let t=0;const bl=.5,arr=notes.map(n=>{const s=t;t+=n.d*bl;return [ +s.toFixed(3), +(t-.02).toFixed(3), n.p, Math.round(30+n.v*90), n.p>=60?'R':'L']});const id='c'+Date.now().toString(36);S.comps.unshift({id,title,notas:arr,dur:+t.toFixed(2),date:new Date().toISOString()});save();toast('Composición guardada en tu Pasaporte.')}

 const prev=S.done[L.id]||0;S.done[L.id]=Math.max(prev,stars);S.xp+=xp;S.coins+=coins;const newDisc=L.disc&&!S.archive.includes(L.disc.id);if(newDisc)S.archive.push(L.disc.id);bumpStreak();save();

$('#wPrev').onclick=()=>{if(curW>0){curW--;S.world=curW;save();drawMap();window.scrollTo(0,scrollCur())}};
$('#wNext').onclick=()=>{if(curW<WORLDS.length-1){curW++;S.world=curW;save();drawMap();window.scrollTo(0,scrollCur())}};
function updateStats(){$('#sXp').textContent=S.xp;$('#sCoins').textContent=S.coins;$('#sStreak').textContent=S.streak.n||0}
function scrollCur(){const W=WORLDS[curW];let i=W.preview?0:W.lessons.findIndex(l=>!S.done[l.id]);if(i<0)i=7;const r=svg.getBoundingClientRect(),H=W.img?W.img.h:1560,Y=W.img?W.img.nodes[i][1]:P[i][1],sc=r.height/H;return Math.max(0,window.scrollY+r.top+Y*sc-window.innerHeight*.55)}
drawMap();requestAnimationFrame(()=>window.scrollTo(0,scrollCur()));

/* ===================== POLVO ===================== */
const cv=$('#dust'),cx=cv.getContext('2d');let DW,DH,parts=[];
function rs(){DW=cv.width=innerWidth*devicePixelRatio;DH=cv.height=innerHeight*devicePixelRatio;parts=Array.from({length:40},()=>({x:Math.random()*DW,y:Math.random()*DH,r:(Math.random()*1.6+.4)*devicePixelRatio,s:Math.random()*.25+.05,a:Math.random()*6}))}rs();addEventListener('resize',rs);
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
(function tick(){cx.clearRect(0,0,DW,DH);for(const p of parts){if(!still){p.y-=p.s*devicePixelRatio;p.a+=.01;p.x+=Math.sin(p.a)*.2;if(p.y<-5){p.y=DH+5;p.x=Math.random()*DW}}cx.globalAlpha=.3+.3*Math.sin(p.a*2);cx.fillStyle=dustColor;cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fill()}if(!still)requestAnimationFrame(tick)})();
})();
</script>
</body></html>
