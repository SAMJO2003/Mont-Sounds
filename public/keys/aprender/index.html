<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07080d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Mont Keys"><style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}[hidden]{display:none!important}html,body{touch-action:manipulation}</style></head><body><title>Mont Keys Aprender</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Special+Elite&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
/* Layout: app de una sola pantalla con tres vistas (Mapa, Lección, Pasaporte). Tema nocturno único; cada mundo cambia el acento. */
:root{
  --night:#0d1226; --panel:#151a30; --line:rgba(241,230,207,.14); --parch:#f1e6cf; --muted:#b7ab98; --ink:#1b1712;
  --gold:#e8c27a; --gold-deep:#9c7432; --wax:#8e2b2b; --ok:#5fd0a4; --bad:#ef6b6b; --acc:#e8c27a;
  --display:'Cinzel',Georgia,serif; --body:'Alegreya Sans',system-ui,sans-serif; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;background:var(--night);color:var(--parch)}
body{font:16px/1.5 var(--body);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--night);z-index:60}
button{font-family:var(--body);color:inherit}
.view{min-height:100%}
#sky{position:fixed;inset:0;z-index:0;transition:background 1s}
#dust{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
#wx,#wxb{position:fixed;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
#wxb{z-index:1}
#map.sunny{filter:drop-shadow(0 30px 40px rgba(0,0,0,.45)) saturate(1.12) brightness(1.04)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto}
/* cabecera del mapa */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding-block:10px 14px;background:linear-gradient(180deg,rgba(11,16,36,.97),rgba(11,16,36,.8) 70%,rgba(11,16,36,0))}
.toprow{display:flex;align-items:center;gap:10px}
.wnav{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:rgba(13,18,38,.6);display:grid;place-items:center;cursor:pointer}
.wnav[disabled]{opacity:.3;cursor:default}
.wtitle{flex:1;min-width:0;text-align:center}
.eyebrow{font:500 11px var(--display);letter-spacing:.2em;color:var(--acc);text-transform:uppercase}
h1{font:700 clamp(18px,5.2vw,23px)/1.15 var(--display);margin:2px 0 0;text-wrap:balance}
.tag{font-size:13px;color:var(--muted);font-style:italic}
.stats{display:flex;justify-content:center;gap:8px;margin-top:8px}
.pill{display:flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;border:1px solid rgba(232,194,122,.3);background:rgba(13,18,38,.6);font:700 13px var(--body);font-variant-numeric:tabular-nums;color:var(--gold)}
.pill svg{width:13px;height:13px}
main{position:relative;z-index:2}
#map{width:100%;max-width:560px;display:block;margin:0 auto}
#map.float{animation:float 7s ease-in-out infinite;filter:drop-shadow(0 30px 40px rgba(0,0,0,.45))}
#map .dimimg{opacity:0;transition:opacity 2.4s ease;pointer-events:none}#map .node{transition:opacity 1.6s ease}
#map.lockedw .dimimg{opacity:1}#map.lockedw .node{opacity:.55}
.node{cursor:pointer}.node:focus{outline:none}.node:focus-visible .ring{stroke:#fff;stroke-width:3}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{opacity:.75;transform:scale(1)}100%{opacity:0;transform:scale(1.9)}}
.float{animation:float 7s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.flick{animation:flick 1.6s ease-in-out infinite alternate}@keyframes flick{from{opacity:.5}to{opacity:1}}
.banner{margin:6px auto 0;max-width:560px;font-size:13px;color:var(--parch);background:rgba(13,18,38,.75);border:1px solid var(--line);border-radius:12px;padding:8px 12px;text-align:center}
/* barra inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;padding-block:8px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(9,12,26,.94);border-top:1px solid var(--line);backdrop-filter:blur(6px)}
.navrow{display:flex;justify-content:space-around;max-width:560px;margin:0 auto}
.nav button,.nav a{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font:700 12px var(--body);color:var(--muted);cursor:pointer;text-decoration:none;padding:4px}
.nav [aria-current="true"]{color:var(--gold)}
.nav svg{width:22px;height:22px}
.spacer{height:calc(78px + env(safe-area-inset-bottom,0px))}
/* hoja */
#scrim{position:fixed;inset:0;background:rgba(5,7,16,.6);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}#sheet.on{transform:none}
.card{max-width:560px;margin:0 auto;background:linear-gradient(180deg,#f4ead5,#e8d9b9);color:var(--ink);border-radius:18px;padding:18px;box-shadow:0 -10px 40px rgba(0,0,0,.45);border:1px solid #c9b48a;display:flex;flex-direction:column;gap:10px;max-height:82vh;overflow:auto}
.card .eyebrow{color:#8a5a22}.card h2{font:700 21px/1.2 var(--display);margin:0;text-wrap:balance}.card p{margin:0;color:#3a3127}
.steps4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.step4{background:rgba(27,23,18,.06);border:1px solid rgba(27,23,18,.12);border-radius:10px;padding:7px 4px;text-align:center;font-size:12px;font-weight:700;color:#4a3d2c}
.step4 span{display:block;font:500 10px var(--display);letter-spacing:.12em;color:#8a5a22}
.cta{border:0;border-radius:12px;padding:13px;font:800 16px var(--body);background:var(--wax);color:#fbeee0;cursor:pointer;width:100%}
.cta.gold{background:linear-gradient(180deg,#f0cf8a,#c99a48);color:#2b1d08}
.cta[disabled]{background:#9a8f80;color:#eee;cursor:default}
.ghost{border:1px solid currentColor;background:transparent;border-radius:12px;padding:11px;font:700 15px var(--body);cursor:pointer;width:100%}
.cta:focus-visible,.ghost:focus-visible,.opt:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.small{font-size:13px;color:#5b4a33}
/* lección */
#vLesson{position:fixed;inset:0;z-index:50;background:radial-gradient(120% 80% at 50% 0%,#1d2342,#0d1226 60%);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.lhead{display:flex;align-items:center;gap:12px;padding-block:12px}
.lx{width:34px;height:34px;flex:none;border-radius:50%;border:1px solid var(--line);background:none;cursor:pointer;display:grid;place-items:center}
.lbar{flex:1;height:10px;border-radius:6px;background:rgba(241,230,207,.12);overflow:hidden}.lbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold-deep),var(--gold));transition:width .4s}
.lphase{font:500 11px var(--display);letter-spacing:.18em;color:var(--acc);text-transform:uppercase}
.lbody{flex:1;overflow:auto;display:flex;flex-direction:column;gap:14px;padding-block:6px 14px}
.lfoot{padding-block:10px 14px}
.lq{font:700 21px/1.25 var(--body);margin:0;text-wrap:balance}
.ltext{font-size:17px;line-height:1.55;color:#e7dcc6;margin:0;max-width:62ch}
.art{border-radius:16px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(232,194,122,.1),rgba(232,194,122,.02));display:grid;place-items:center;min-height:150px;padding:12px}
.art svg{width:100%;max-width:300px;height:auto}
.fact{border-left:3px solid var(--acc);padding:8px 12px;background:rgba(232,194,122,.08);border-radius:0 10px 10px 0;font-size:15px;color:#e7dcc6}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:rgba(241,230,207,.04);border-radius:14px;padding:13px 14px;font:600 16px var(--body);cursor:pointer}
.opt.sel{border-color:var(--gold)}.opt.ok{border-color:var(--ok);background:rgba(95,208,164,.14)}.opt.bad{border-color:var(--bad);background:rgba(239,107,107,.12)}
.fb{border-radius:14px;padding:12px 14px;font-size:15px;display:none}.fb.on{display:block}
.fb.ok{background:rgba(95,208,164,.15);border:1px solid rgba(95,208,164,.5)}.fb.bad{background:rgba(239,107,107,.13);border:1px solid rgba(239,107,107,.45)}
.fb b{display:block;font-size:16px;margin-bottom:2px}
/* teclado */
.kb{position:relative;height:150px;user-select:none;-webkit-user-select:none;touch-action:none;border-radius:10px;overflow:hidden;background:#111;border:1px solid #000}
.kw{position:absolute;top:0;bottom:0;background:linear-gradient(180deg,#fdfbf6,#ece4d2);border-right:1px solid #9c9282;border-radius:0 0 6px 6px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font:700 11px var(--body);color:#6b6152}
.kbk{position:absolute;top:0;height:60%;background:linear-gradient(180deg,#2a2622,#0e0c0a);border-radius:0 0 4px 4px;z-index:2;box-shadow:0 2px 3px rgba(0,0,0,.5)}
.kw.hit,.kbk.hit{background:var(--gold)!important}.kw.good,.kbk.good{background:var(--ok)!important}.kw.wrong,.kbk.wrong{background:var(--bad)!important}.kw.hint{box-shadow:inset 0 -6px 0 var(--acc)}
.kbk.hint{box-shadow:inset 0 -6px 0 var(--acc)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chipb{border:1px solid var(--line);background:rgba(241,230,207,.05);border-radius:999px;padding:6px 12px;font:700 13px var(--body);cursor:pointer}
.chipb[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.meter{height:10px;border-radius:6px;background:rgba(241,230,207,.12);overflow:hidden}.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5fd0a4,#ffd56e 70%,#ef6b6b)}
.big{font:800 34px var(--display);text-align:center;color:var(--gold);margin:0}
.notes{display:flex;gap:6px;flex-wrap:wrap;min-height:34px}
.nchip{border-radius:8px;padding:4px 9px;background:rgba(232,194,122,.16);border:1px solid rgba(232,194,122,.4);font:700 14px var(--body)}
.tapbtn{height:120px;border-radius:24px;border:2px solid var(--gold);background:rgba(232,194,122,.12);font:800 22px var(--display);color:var(--gold);cursor:pointer;touch-action:manipulation;width:100%}
.tapbtn:active{background:rgba(232,194,122,.3)}
.done{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.stars{display:flex;gap:10px}.stars svg{width:48px;height:48px}
.acard{width:100%;background:linear-gradient(180deg,#f4ead5,#e3d1ac);color:var(--ink);border-radius:16px;padding:14px;text-align:left;border:1px solid #c9b48a;display:flex;flex-direction:column;gap:6px}
.acard h3{font:700 18px var(--display);margin:0}.acard .per{font-size:13px;color:#7a5a2a;font-weight:700}.acard p{margin:0;color:#3a3127;font-size:15px}
/* pasaporte */
.pass{position:relative;z-index:2;padding-block:16px 20px;display:flex;flex-direction:column;gap:18px}
.pass h2{font:700 22px var(--display);margin:0}
.stamps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stamp{aspect-ratio:1;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;text-align:center;font:700 10px var(--display);letter-spacing:.08em;color:var(--muted);padding:6px}
.stamp.on{border:3px double var(--sc);color:var(--sc);transform:rotate(-8deg);background:rgba(255,255,255,.03)}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.aitem{border-radius:14px;border:1px solid var(--line);background:rgba(241,230,207,.05);padding:12px;text-align:left;cursor:pointer;font:600 14px var(--body)}
.aitem small{display:block;color:var(--muted);font-weight:500}
.aitem.lock{opacity:.4;cursor:default}
.comp{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:rgba(241,230,207,.04)}
.comp b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{border:1px solid var(--line);background:none;border-radius:10px;padding:7px 10px;font:700 13px var(--body);cursor:pointer}
.empty{color:var(--muted);font-size:15px}

.microw{display:flex;gap:8px;margin-top:-4px}.micbtn{flex:1;border:1.5px solid var(--ok);background:rgba(95,208,164,.1);color:var(--ok);border-radius:12px;padding:10px;font:800 15px var(--body);cursor:pointer}.micbtn.on{background:rgba(95,208,164,.22)}.micbtn.sm{flex:none;font-size:13px;padding:10px 12px}#micb{display:none}
.earhud{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ok);padding:4px 0}.earhud span{flex:none;max-width:70%}.earhud .meter{flex:1;height:6px}
.scene{display:flex;justify-content:space-around;gap:6px;padding:6px 8px;border-radius:14px;background:rgba(241,230,207,.05);border:1px solid var(--line)}
.sc{display:flex;flex-direction:column;align-items:center;gap:1px;color:rgba(241,230,207,.3);font-size:11px;transition:color .6s}.sc small{font-size:10px}
.sc.on{color:var(--gold);filter:drop-shadow(0 0 6px rgba(232,194,122,.7))}
.bellfield{position:relative;width:100%;aspect-ratio:760/554;border-radius:16px;background-color:#2a1c12;background-size:157.9% auto;background-position:52.3% 32.2%;background-repeat:no-repeat;border:1px solid var(--line);overflow:hidden;box-shadow:inset 0 0 40px rgba(0,0,0,.45)}
.bellb{position:absolute;transform:translate(-50%,-7px);background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;outline:none;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;display:flex;flex-direction:column;align-items:center;padding:0;width:56px}
.bellb:focus-visible .bimg{outline:2px solid var(--gold);outline-offset:3px;border-radius:8px}.bellb .bimg{display:block;width:clamp(34px,10vw,50px);height:auto;transform-origin:50% 4%;filter:drop-shadow(0 4px 4px rgba(0,0,0,.45));pointer-events:none;-webkit-user-drag:none}.bellb.ring .bimg{animation:swing .6s ease}.bellb.sel .bimg{filter:drop-shadow(0 0 10px #ffd56e) drop-shadow(0 4px 4px rgba(0,0,0,.45))}.bellb.lit .bimg{filter:drop-shadow(0 0 14px #ffd56e)}
@keyframes swing{0%{transform:rotate(0)}25%{transform:rotate(14deg)}50%{transform:rotate(-10deg)}75%{transform:rotate(5deg)}100%{transform:rotate(0)}}
.bellb .bn{position:absolute;top:-4px;right:12px;background:var(--wax);color:#fff;border-radius:50%;width:20px;height:20px;font-size:12px;display:grid;place-items:center}
.bellb .bw{display:block;width:50px;background:rgba(10,8,6,.55);border-radius:6px}
.cmpw{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;align-items:center;margin-top:8px;font-size:12px}
.fountain{border-radius:16px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(62,136,200,.08),rgba(62,136,200,.02));padding:6px}
.wbars{display:flex;gap:6px;align-items:center;min-height:22px;flex-wrap:wrap}.wb{height:12px;border-radius:6px;background:#6fb6ee;display:inline-block}.wb.s{width:22px}.wb.l{width:70px}.wb.r{width:34px;background:none;border:2px dashed rgba(241,230,207,.35);height:10px}.wb.q{width:40px;background:rgba(241,230,207,.15)}
.wbars.mine .wb{background:var(--gold)}
.lamps{display:flex;justify-content:center;gap:14px}.lamp{color:rgba(241,230,207,.3)}.lamp.cur{color:var(--parch)}.lamp.on{color:#ffd56e;filter:drop-shadow(0 0 8px #ffd56e)}
.seqcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}.seqc{border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:2px;font-size:14px}.seqc b{color:var(--gold)}.seqc.cur{border-color:var(--gold)}.seqc.ok{border-color:var(--ok);background:rgba(95,208,164,.1)}
.mcards{display:flex;flex-direction:column;gap:8px}.mc{display:flex;justify-content:space-between;align-items:center}.mc.sel{border-color:var(--gold)}

.lscene{position:relative;width:100%;aspect-ratio:1200/896;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#1a1410}
.lscene.portada{aspect-ratio:1264/848}
.lscene .ls{position:absolute;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat}
.ls-clouds{overflow:hidden}.ls-clouds .cl{position:absolute;left:-60%;height:auto;animation-name:drift;animation-timing-function:linear;animation-iteration-count:infinite;will-change:transform}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(var(--d,420%))}}
.bellfield{background:none!important}.bellfield .lscene{position:absolute;inset:0;border:0;border-radius:0;aspect-ratio:auto}
.bellfield .ls{background-size:157.9% auto;background-position:52.3% 32.2%}
.bf-bells{position:absolute;inset:0;z-index:3}
.lscene canvas.water{position:absolute;inset:0;width:100%;height:100%;z-index:4;pointer-events:none}
.lscene.plaza{aspect-ratio:1200/896}.luz{position:absolute;opacity:0;transition:opacity 1.4s ease;pointer-events:none;mix-blend-mode:screen}.luz.on{opacity:1;animation:flame 3.2s ease-in-out infinite alternate}
@keyframes flame{0%{filter:brightness(1)}50%{filter:brightness(1.12)}100%{filter:brightness(.94)}}
@media (prefers-reduced-motion:reduce){.ls-clouds .cl,.luz.on{animation:none}.pulse,.float,.flick{animation:none}#sheet,#scrim,.lbar i{transition:none}}
/* ===== MODO JUEGO: pantalla completa vertical, escenas y narración (estilo novela ilustrada) ===== */
#vLesson.game{inset:0 auto 0 50%;width:min(100%,520px);transform:translateX(-50%);background:#07080d;box-shadow:0 0 0 100vmax #05060b;overflow:hidden}
#vLesson.game #gBack{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(26px) brightness(.42) saturate(1.1);transform:scale(1.1);z-index:0;transition:background-image .6s}
#vLesson.game #gBack::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 70% at 50% 30%,transparent,rgba(5,6,11,.75))}
#vLesson.game>*{position:relative;z-index:1}
#vLesson.game .gut{padding-inline:0}
#vLesson.game .wrap{max-width:none}
#vLesson.game .lhead{padding:10px 12px;z-index:6;position:relative}
#vLesson.game .lbar{background:rgba(255,255,255,.12)}
#vLesson.game .earhud{padding:2px 14px}
#vLesson.game .lbody{padding:0 0 10px;gap:0}
#vLesson.game #lStage{gap:12px;padding:0 14px}
#vLesson.game #lStage>.scene{display:none}
#vLesson.game #lStage>.lphase{order:-2;text-align:center;font-size:10px;letter-spacing:.24em;opacity:.85;margin-top:2px}
#vLesson.game #lStage>.lscene,#vLesson.game #lStage>.bellfield,#vLesson.game #lStage>.mstage{order:-1;margin-inline:-14px;width:calc(100% + 28px);border-radius:0;border:0;-webkit-mask-image:linear-gradient(180deg,#000 82%,transparent);mask-image:linear-gradient(180deg,#000 82%,transparent)}
#vLesson.game #lStage>.lamps{order:-1}
#vLesson.game #lStage>.g-say,#vLesson.game #lStage>.fb{order:0}
#vLesson.game #lStage>*{order:1}
#vLesson.game #lStage:has(>.fb.on)>.g-say{display:none}
#vLesson.game .big{font-size:22px}
.g-say,#vLesson.game .fb,.cut-say{font:400 16.5px/1.55 'Special Elite','Courier New',monospace;color:#f3e9d6;background:linear-gradient(180deg,rgba(16,13,10,.9),rgba(10,8,7,.94));border:1px solid rgba(232,194,122,.28);border-radius:6px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.45);margin:0}
.g-say b.g-q{font-weight:400;color:#f7e7c4}
.g-say .g-sub{display:block;margin-top:6px;color:#d9ccb2}
#vLesson.game .fb.on.ok{border-color:rgba(95,208,164,.55);border-left:4px solid var(--ok)}
#vLesson.game .fb.on.bad{border-color:rgba(239,107,107,.5);border-left:4px solid var(--bad)}
#vLesson.game .fb b{display:block;font-weight:400;color:#fff;margin-bottom:3px}
.g-who,.cs-who{display:flex;align-items:center;gap:8px;margin:-2px 0 6px;font:700 12px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.g-who svg,.cs-who svg{width:34px;height:34px;border-radius:50%;background:#1c1712;border:1px solid rgba(232,194,122,.5);flex:none}
#vLesson.game .lfoot{padding:8px 14px 12px}
#vLesson.game .lfoot:has(#lFoot:empty){display:none}

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const BASE=location.pathname.replace(/\/?$/,'/'),STUDIO=BASE.replace(/[^/]+\/$/,'');
const NAMES=['Do','Do♯','Re','Re♯','Mi','Fa','Fa♯','Sol','Sol♯','La','La♯','Si'];
const LET=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const isBlack=p=>[1,3,6,8,10].includes(((p%12)+12)%12);
const nm=p=>NAMES[p%12];
const nmOct=p=>NAMES[p%12]+(Math.floor(p/12)-1);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ===================== MUNDOS Y CONTENIDO ===================== */
const W1={id:'w1',num:'I',place:'Firenze',name:'El Renacimiento italiano',tag:'Donde la música encontró una nueva voz',
 sky:'linear-gradient(180deg,#0b1024 0%,#1c1d3c 30%,#3b2a48 58%,#7a4240 80%,#c06d3c 100%)',acc:'#e8c27a',
 pal:{top:['#b9a07c','#8f7556'],cliff:['#5b4a3b','#1e1915'],mid:'#4e4033',house:'#d9c3a0',houseSh:'#b89f7c',roof:'#b35a36',roofSh:'#8a4229',tree:'#1f2e22',tree2:'#2c4230',plaza:'#cdb48c',cloud:'#e9b48a',rim:'#f6c27a',dust:'#ffd99a'},
 landmark:'duomo',stampColor:'#e8c27a',
 img:{src:'w1i.webp',w:768,h:2048,float:true,nodes:[[475,1783],[323,1664],[519,1546],[331,1427],[524,1309],[282,1190],[454,1072],[276,953],[483,834],[347,716],[526,597],[300,479],[447,360]],chest:[425,1454]},
 chapters:[[0,'Parte I · La ciudad de la música'],[3,'Parte II · Las voces olvidadas'],[7,'Parte III · Entender la música'],[10,'Parte IV · Expresarte']],
 lessons:[
 /* ---------------- 01 ---------------- */
 {id:'w1m01',t:'La ciudad de la música',d:'Florencia sigue en pie, pero ha perdido su alma. Recorre la ciudad, ayuda a Matteo y a tres jóvenes músicos a recuperar el antiguo ritual del Espíritu Guardián.',scene:true,game:true,
  disc:{id:'a-florencia',name:'La vida musical en Florencia',per:'Renacimiento · siglos XV y XVI',text:'Durante el Renacimiento, la música formaba parte de la vida cotidiana y ceremonial de Florencia: sonaba en iglesias, cortes, hogares y celebraciones públicas. Las campanas organizaban los momentos importantes de la comunidad, los músicos tocaban en vivo y los manuscritos se copiaban a mano. (La historia de Matteo y el Espíritu Guardián es ficción inspirada en esa época.)',sig:'Sin grabaciones, cada interpretación era única: la música era expresión, celebración y convivencia.'},
  steps:[
   /* INTRO CORTA */
   {type:'scene',act:['Florencia, 1530','La ciudad de la música'],img:'llegada',move:'zoom',lines:['Después de un largo viaje, por fin ves Florencia.','Desde lejos parece hermosa… pero no se oye nada. Ni campanas, ni música. Algo anda mal.']},
   {type:'citymap',from:'puerta',go:'campanario',act:'Misión 1',mission:'Entra en la ciudad y busca al campanero del campanario.'},
   {type:'scene',img:'matteo',who:'matteo',move:'zoom',lines:['—¿Un viajero? Bienvenido. Me llamo Matteo, custodio del campanario.','—Hace quince años nuestro Espíritu Guardián dejó de responder. La ciudad sigue viva… pero sin alma.','—Solo un antiguo ritual musical puede despertarlo. Empieza por las campanas: ¿me ayudas?'],accept:'¡Vamos!',reward:'Matteo te entrega una pequeña insignia ceremonial.',badge:'insignia-florencia'},
   /* LAS CAMPANAS (con vela) */
   {type:'bells',who:'matteo',ph:'Misión 1 · Las campanas escondidas',q:'—¡La campana más grave!',sub:'Toca cada campana para oírla y elige antes de que se apague la vela.',short:'¡La más grave!',mode:'low',n:3,gap:7,lo:48,hi:84,time:20,win:'¡La campana grave despierta!'},
   {type:'bells',who:'matteo',ph:'Misión 1 · Las campanas escondidas',q:'—¡Ahora la más aguda!',sub:'Más campanas y menos tiempo.',short:'¡La más aguda!',mode:'high',n:4,gap:4,lo:52,hi:84,time:16,win:'¡La campana más aguda responde!'},
   {type:'bells',who:'matteo',ph:'Misión 1 · Las campanas escondidas',q:'—¡Ronda relámpago!',sub:'5 rondas · 8 segundos · 3 vidas. En cada ronda te diré: ¿la más grave o la más aguda?',short:'¡Ronda relámpago!',mode:'rush',rounds:5,n:3,gap:6,lo:50,hi:82,time:8,roundTime:8,win:'¡Ronda relámpago superada!',why:'Distinguir alturas parecidas es entrenar el oído fino: así los músicos notan un semitono de diferencia.'},
   {type:'bells',who:'matteo',ph:'Misión 1 · Las campanas escondidas',q:'Matteo descubre una secuencia grabada en el mecanismo.',sub:'—Ordénalas de la más grave a la más aguda para que gire.',mode:'order',n:4,gap:3,lo:55,hi:79,win:'¡El mecanismo gira!',why:'Ordenar sonidos por altura es la base de las escalas: de grave a agudo, como subir una escalera.'},
   {type:'bells',who:'matteo',ph:'Misión 1 · Las campanas escondidas',q:'—Estas campanas forman una escalera que sube.',sub:'De izquierda a derecha, cada una suena un escalón más aguda que la anterior. Una rompe la escalera: ¡encuéntrala!',short:'¡La que rompe la subida!',mode:'broken',n:4,step:2,time:20,win:'¡Encontraste la campana que rompía la escalera!',why:'scale'},
   {type:'bells',who:'matteo',ph:'Misión 1 · Las campanas escondidas',q:'—La primera llamada está casi lista.',sub:'Repite la secuencia de campanas en el mismo orden.',mode:'repeat',n:4,len:4,gap:4,lo:55,hi:81,win:'¡El campanario ha despertado!',why:'Recordar y repetir una secuencia de alturas es exactamente lo que haces al aprender una melodía.'},
   /* LOS FLORINES Y EL PRIMER ESPÍRITU */
   {type:'scene',img:'matteo',who:'matteo',move:'zoom',coins:20,lines:['—¡El campanario ha despertado! Toma, te los has ganado: 20 florines.','—Los florines son la moneda de Florencia. Los ganarás ayudando a la ciudad y calmando espíritus.','—Con ellos podrás comprar comida que fortalece al héroe, materiales para el lutier y, más adelante, nuevos instrumentos para vencer a espíritus más fuertes.','—Guárdalos bien… Espera. ¿Oyes ese ruido? Viene de la ciudad. ¡Encuéntralo antes de que despierte a todos!']},
   {type:'citymap',go:'__hunt',act:'Misión 1 · El primer espíritu',mission:'Un ruido extraño recorre la ciudad. Busca al Espíritu del Ruido: dicen que ronda al sureste de la plaza.',hunt:{x:1110,y:1660,name:'Espíritu del Ruido',heroHP:3,coins:10,winBtn:'Volver al mapa',winText:'Do mayor quedó guardado en tu libro de acordes 📖. Con él podrás calmar a otros espíritus.',intro:['El espíritu chirría y se lanza contra ti. ¡Tu piano viejo responde!','Un acorde son varias notas a la vez. Do mayor = Do, Mi y Sol. En el pentagrama se escriben apiladas.','Si tocas bien el acorde, el espíritu pierde fuerza. Si te equivocas de nota, él te quita vida.'],introStaff:{notes:[{ps:[60,64,67],d:'w'}],names:true,w:170,cap:'Do mayor'},tasks:[{t:'chord',ch:'C',hint:true,say:'¡Ataca con Do mayor: Do, Mi y Sol a la vez!'}]}},
   /* LA FUENTE */
   {type:'citymap',go:'fuente',act:'Misión 2',mission:'Matteo te pide ir a la fuente: el agua de la ciudad dejó de fluir.'},
   {type:'water',who:'matteo',ph:'Misión 2 · El agua que fluye',q:'—El agua sigue un ritmo de sonidos cortos y largos.',sub:'Escucha y tócalo en cualquier tecla: corto = toca y suelta · largo = mantén.',n:4,win:'¡El agua empieza a moverse!',why:'En la partitura, la negra dura un pulso y la blanca dos: una blanca dura el doble que una negra.'},
   {type:'water',who:'matteo',ph:'Misión 2 · El agua que fluye',q:'—No todo en la música es sonido. Respeta el silencio.',sub:'Cuando llegue el silencio, suelta y espera antes de seguir.',n:4,rests:true,win:'¡Has respetado el silencio!',why:'Un silencio dura un tiempo, igual que un sonido. En la partitura tiene sus propios símbolos.'},
   {type:'water',who:'matteo',ph:'Misión 2 · El agua que fluye',q:'Una secuencia antigua aparece en la piedra.',sub:'—Repítela de memoria. El agua recordará su movimiento.',n:5,hidden:true,win:'¡El ritmo ha regresado!',why:'Para recordar un ritmo, divídelo en grupos pequeños.'},
   {type:'scene',img:'fuente',fx:'water',who:'matteo',lines:['El agua vuelve a correr por la fuente.','—La ciudad empieza a recordar cómo latir. Esta noche, la plaza.']},
   /* LA PLAZA DE NOCHE */
   {type:'citymap',night:true,go:'plaza',act:'Misión 3',mission:'Cae la noche. Ve a la plaza: sus faroles siguen apagados.'},
   {type:'lights',who:'matteo',ph:'Misión 3 · La plaza en silencio',q:'—Las luces son la expresión de la música. Controla la intensidad.',tasks:[{do:'soft',say:'Toca una nota suave (piano)'},{do:'strong',say:'Ahora una nota fuerte (forte)'}]},
   {type:'scene',img:'violin',who:'violin',move:'zoom',lines:['Una joven violinista se acerca con su violín en la mano.','—Soy parte del ritual. La plaza solo vuelve a brillar con armonía.','—Te enseñaré a leer cómo se tocan las notas en una partitura: separadas o conectadas.']},
   {type:'lights',who:'violin',ph:'Misión 3 · La plaza en silencio',q:'—Empecemos con el acorde que ya conoces.',sub:'Do mayor: Do, Mi y Sol a la vez.',tasks:[{chord:'C',say:'Construye Do mayor: Do, Mi y Sol a la vez'}]},
   {type:'lights',who:'violin',ph:'Misión 3 · La plaza en silencio',q:'—Hay notas separadas y notas conectadas.',tasks:[{chord:'C',art:'s',say:'Do mayor staccato: tócalo y suéltalo enseguida'},{chord:'C',art:'l',say:'Do mayor legato: mantenlo sonando'},{chord:'F',say:'Fa mayor: Fa, La y Do'}]},
   {type:'lights',who:'violin',ph:'Misión 3 · La plaza en silencio',q:'—La música también se adorna: ¡recuperemos el trino!',tasks:[{do:'trill',say:'Trino: alterna Mi y Fa, cada vez más rápido'}]},
   {type:'lights',who:'matteo',ph:'Misión 3 · La plaza en silencio',q:'La plaza empieza a brillar.',sub:'—Ahora haz crecer la luz… y luego apágala suavemente.',tasks:[{do:'cresc',say:'Crescendo: 5 notas, cada una más fuerte'},{do:'dim',say:'Diminuendo: 5 notas, cada una más suave'}],wakeMsg:'¡La luz ha respondido a tu interpretación!'},
   {type:'seqperf',who:'matteo',ph:'Misión 3 · La fuente musical',q:'—Una nota puede ser grave, larga y suave a la vez.',sub:'Mira la demostración y toca cada nota cumpliendo su tarjeta.',seq:[{reg:'low',dur:'long'},{reg:'high',dur:'short'},{reg:'low',dyn:'soft'}],win:'¡Has combinado correctamente las características!'},
   {type:'seqperf',who:'matteo',ph:'Misión 3 · La fuente musical',q:'Una secuencia del ritual aparece sobre el agua.',sub:'—Tras la demostración, las tarjetas se ocultan. ¡De memoria!',n:4,memory:true,win:'¡La fuente reconoce el patrón ceremonial!'},
   {type:'scene',img:'violin',who:'violin',lines:['—¡La plaza vuelve a brillar!','—Ven al escenario, frente a la fuente. El flautista y el laudista nos esperan… aunque están un poco nerviosos.']},
   /* LOS MÚSICOS */
   {type:'citymap',go:'escenario',act:'Misión 4',mission:'La violinista te invita al escenario, frente a la fuente. Ayuda a los músicos antes del ritual.'},
   {type:'musico',mode:'odd',who:'violin',ref:69,n:5,ph:'Misión 4 · Los tres músicos',q:'La violinista parece preocupada.',sub:'—No quiero equivocarme. Una de mis notas de afinación suena distinta… ¿cuál?',win:'¡Has encontrado la nota equivocada!'},
   {type:'musico',mode:'tune',who:'violin',ph:'Misión 4 · Los tres músicos',q:'—Una cuerda necesita ajustarse.',sub:'Gira la clavija hasta que su cuerda suene igual que la referencia.',win:'¡La cuerda está afinada!'},
   {type:'musico',mode:'contour',who:'flauta',ph:'Misión 4 · Los tres músicos',q:'El flautista se une al grupo.',sub:'—Me pierdo cuando los demás empiezan. ¿Mis notas suben, bajan o se repiten?',win:'¡Has reconocido el movimiento de la melodía!'},
   {type:'musico',mode:'odd',who:'flauta',base:[67,69,71,72,74],ph:'Misión 4 · Los tres músicos',q:'—Algo cambió en mi melodía.',sub:'Mi melodía es una progresión: sube paso a paso, como una escalera (Sol, La, Si, Do, Re). Una nota rompe esa subida: ¿cuál es?',why:'En una progresión cada nota sigue el mismo patrón (aquí, un escalón hacia arriba). Cuando una nota se sale del patrón, el oído la nota enseguida.',win:'¡La melodía vuelve a estar completa!'},
   {type:'musico',mode:'rhythm',who:'laud',ph:'Misión 4 · Los tres músicos',q:'El laudista llega sonriendo.',sub:'—Tengo la melodía, pero una de mis partes no suena como el modelo.',win:'¡Has encontrado el cambio de ritmo!'},
   {type:'melody',stage:['flauta','violin','laud'],ph:'Misión 4 · Los tres músicos',q:'Los tres se colocan en sus posiciones.',sub:'—Toquemos juntos. Sigue las teclas iluminadas: cada nota que toques la tocaremos los tres.',notes:[60,64,67,65,64,62,60],show:'keys',lo:55,hi:72,kind:'trio',gold:true},
   /* EL RITUAL */
   {type:'scene',img:'escenario',who:'matteo',move:'zoom',lines:['—Ha llegado el momento.','—El ritual no consiste en copiar una melodía antigua. El último Músico Maestro dejó una página en blanco…','—Ahora es tu turno de escribir algo que represente a esta ciudad.']},
   {type:'create',who:'matteo',ph:'El ritual',q:'—Escribe tu melodía para el ritual.',sub:'Entre 6 y 8 notas: al menos una grave y una aguda, negras (cortas) y blancas (largas), y una nota piano y una forte.',len:8,minLen:6,lo:48,hi:79,durations:true,dyn:true,require:{dur:true,dyn:true,range:true},keep:'plaza'},
   {type:'melody',stage:['flauta','violin','laud'],ph:'El ritual',q:'Los músicos esperan tu señal.',sub:'Toca tu creación completa con tu instrumento.',notes:'plaza',show:'keys',lo:48,hi:79,saveFrom:'plaza',title:'Mi primera pieza (Florencia)'},
   {type:'scene',img:'final',fx:'gold',playKeep:'plaza',who:'matteo',loop:true,lines:['Los tres músicos interpretan el ritual… con tu melodía.','Las campanas responden. La fuente se ilumina y los faroles despiertan.','Una presencia luminosa aparece sobre la plaza: el Espíritu Guardián ha regresado.','Los habitantes recuperan sus sueños. Un artesano vuelve a crear, una niña empieza a dibujar.','—La ciudad ha recordado quién es.']},
   {type:'scene',img:'llegada',who:'matteo',move:'zoom',lines:['—Has hecho mucho por Florencia. Pero tu viaje no termina aquí.','Observas el camino que sale de la ciudad. Una nueva aventura te espera.']}
  ]},
 /* ---------------- 02 ---------------- */
 {id:'w1m02',t:'El origen de los instrumentos',d:'El maestro Bernardo necesita madera de los abetos resonantes. Aprende qué vibra en cada instrumento, cruza la puerta oeste, recoge madera y savia mágica y enfréntate a los Espíritus del Ruido del bosque.',scene:true,game:true,
  disc:{id:'a-familias',name:'Cómo se clasifican los instrumentos',per:'Sistema publicado en 1914',text:'Los musicólogos Erich von Hornbostel y Curt Sachs propusieron en 1914 clasificar los instrumentos según qué vibra: una cuerda, una columna de aire, una membrana o el propio cuerpo del instrumento. Su sistema, con ampliaciones posteriores, se sigue usando en los museos.',sig:'Saber qué vibra te ayuda a entender por qué cada instrumento suena como suena.'},
  steps:[
   {type:'scene',act:['Módulo 2','El origen de los instrumentos'],img:'taller_fuera',move:'zoom',lines:['El Espíritu Guardián despertó y Florencia vuelve a sonar.','Pero los músicos de la ciudad necesitan instrumentos nuevos… y el maestro Bernardo, el lutier, te ha mandado llamar.']},
   {type:'citymap',from:'puerta',go:'taller',act:'Misión 1',mission:'Ve al taller del maestro Bernardo, al suroeste de la plaza.'},
   {type:'scene',img:'taller_m2',who:'maestro',move:'zoom',fl:{1:['m2/fam_violin','m2/fam_flauta','m2/fam_tambor'],2:['ui_piano']},lines:['—¡Viajero! Pasa, pasa. Aquí nacen los instrumentos de Florencia.','—Todo instrumento suena porque algo vibra. En la cuerda vibra una cuerda; en el viento, el aire dentro de un tubo; en la percusión, un parche o el propio cuerpo del instrumento.','—Tu piano viejo es especial: es de teclado, pero por dentro unos martillos golpean cuerdas. Veamos si distingues las familias.']},
   {type:'sort',who:'maestro',ph:'Práctica',q:'Clasifica cada instrumento en su familia',fams:['Cuerda','Viento','Percusión'],items:[['Violín',0],['Flauta',1],['Tambor',2],['Laúd',0],['Trompeta',1],['Pandero',2],['Arpa',0],['Chirimía',1]]},
   {type:'timbre',who:'maestro',ph:'Práctica',q:'Escucha y mira: ¿de qué familia es?',items:[{kind:'strings',opts:['Cuerda','Viento','Percusión'],a:0},{kind:'flute',opts:['Cuerda','Viento','Percusión'],a:1},{kind:'drum',opts:['Cuerda','Viento','Percusión'],a:2}]},
   {type:'scene',img:'taller_m2',who:'maestro',move:'zoom',give:'piccolo',giveAt:2,chords:['F','G'],fl:{0:['m2/ic_madera_comun','m2/ic_resina'],1:['bosque/abeto_1','bosque/abeto_resonante'],2:['m2/instr_piccolo'],3:['town/p_espiritu_ruido','ui_piano'],4:['m2/ic_madera_comun','m2/ic_resina']},lines:['—¡Muy bien! Ahora necesito tu ayuda: para crear un instrumento mágico necesito 24 de madera común y 9 de savia mágica.','—La madera común la da cualquier abeto. La savia mágica solo la dan los abetos resonantes: los más antiguos, con chispas doradas. Crecen al otro lado de la puerta oeste.','—Toma este piccolo. Con su soplo recogerás madera y savia. Pero ojo: el piccolo no sirve para combatir.','—En el bosque rondan Espíritus del Ruido. Si te tocan, invoca tu piano y enfréntalos con acordes. Los anoté en tu libro.','—Y cuidado: lo que recojas va en tu mochila. Solo queda guardado cuando sales del bosque. Si un espíritu te vence, lo pierdes todo.']},
   {type:'citymap',go:'oeste',act:'Misión 2',mission:'La puerta oeste ya está abierta. Sal de la ciudad hacia el bosque.'},
   {type:'forest',act:'Misión 2 · Bosque de los Abetos Resonantes',need:9,needC:24,mission:'Para el instrumento mágico: 9 de savia mágica (abetos con chispas doradas) y 24 de madera común (cualquier abeto).'},
   {type:'citymap',from:'oeste',go:'taller',act:'Misión 3',mission:'Lleva la madera y la savia mágica al taller del maestro Bernardo.'},
   {type:'scene',img:'maestro_forja',who:'maestro',move:'zoom',give:'piccolo_raro',giveAt:1,pay:{madera_comun:24,savia_magica:9},fl:{0:['m2/ic_resina'],1:['m2/instr_piccolo_raro'],2:['m2/instr_piccolo_raro','m2/ic_madera_comun']},lines:['—¡Savia mágica! Mira: con ella las cuerdas vibran mucho más tiempo. Por eso los instrumentos mágicos la necesitan.','—Con la madera y la savia reforcé tu piccolo. Ahora es un Piccolo resonante: más fuerte, y podrá recoger materiales que antes no podía.','—Será tu herramienta de supervivencia: lo necesitarás en cada misión para conseguir madera y savia.'],accept:'Completar el módulo',reward:'🏅 Módulo 2 completado: El origen de los instrumentos'}
  ]},
 /* ---------------- 03 ---------------- */
 {id:'w1m03',t:'El lenguaje escrito',d:'El manuscrito de las voces perdidas: cada medianoche suena una melodía en el scriptorium. Con Isabella, aprende a leer música para resolver sus acertijos y descubrir la primera pista del Maestro Compositor.',scene:true,game:true,
  disc:{id:'a-guido',name:'Guido d’Arezzo',per:'Monje italiano · nacido hacia el año 991',text:'Maestro de música que ideó un sistema de líneas separadas por terceras para escribir la altura exacta de las notas, la base de nuestro pentagrama, y un método con sílabas para aprender a cantar. Lo explicó en su tratado «Micrologus», escrito hacia 1025.',sig:'Gracias a su sistema, un cantante podía aprender una melodía nueva leyendo, sin oírla antes.'},
  steps:[
   {type:'scene',act:['Módulo 3','El manuscrito de las voces perdidas'],img:'plaza_on',move:'zoom',lines:['Florencia vuelve a sonar. Pero cada medianoche ocurre algo extraño…','Una melodía sale del scriptorium… y siempre se corta en la misma nota.']},
   {type:'citymap',from:'puerta',go:'campanario',act:'Misión 1',mission:'Es medianoche. Matteo quiere verte en el campanario.'},
   {type:'scene',img:'matteo',who:'matteo',move:'zoom',lines:['—Desde que volvió el Guardián, una melodía suena cada noche en el scriptorium.','—Ve a ver a Isabella. Y ten cuidado: nadie ha entrado en esa habitación en quince años.']},
   {type:'citymap',go:'scriptorium',act:'Misión 1',mission:'Ve al scriptorium, al noroeste de la ciudad. Busca a Isabella.'},
   /* SALA 1 · SCRIPTORIUM */
   {type:'room',room:'scrip',who:'isabella',act:'El scriptorium',start:[180,520],
    intro:['Los pergaminos de las mesas están en blanco: las notas han desaparecido.','—Durante quince años, esa puerta permaneció en silencio.','—Ahora alguien toca dentro cada noche… y nadie tiene la llave.','—Esta partitura puede abrirla. Pero antes tendrás que entender cómo se escribe la música.'],
    hot:[{id:'isa',kind:'talk',ic:'isabella',label:'Isabella',x:300,y:250,opt:1,lines:['—Investiga lo que brilla. Cada objeto guarda una parte del secreto.']},
     {id:'a1',kind:'mystery',label:'Pergamino',x:85,y:200,hint:'Investiga el pergamino en blanco del escritorio.',
      after:['Se encienden dos velas más. En las mesas, los pergaminos muestran líneas vacías.','—«Donde el sonido sube y baja…» La frase está incompleta.'],
      m:{type:'mystery',n:1,title:'Las cinco líneas perdidas',obj:'perg',mode:'lines',clef:false,noNames:true,ink:'Donde el sonido sube y baja…',
       intro:['—Este pergamino perdió sus líneas. La música se escribe sobre cinco.','—Toca cada tecla que brille: cada una dibujará una línea, de abajo hacia arriba.'],
       rounds:[{aid:1,say:'Sigue la tecla que brilla.',seq:[{p:64},{p:67},{p:71},{p:74},{p:77}]}],
       reveal:'Cinco líneas: el pentagrama.',revealSub:'Entre ellas quedan cuatro espacios. El pergamino escribe solo una frase… que no termina.'}},
     {id:'a2',kind:'mystery',label:'Libro',x:275,y:200,need:['a1'],locked:'Primero el pergamino.',hint:'Ahora el libro del que escapan notas.',
      after:['¡Un libro cae de la estantería! Entre sus páginas hay un dibujo: la habitación prohibida, con una clave en la puerta.','De pronto, la vela principal se apaga sola.','—¿Lo has visto? Algo pasó junto a nosotros.','—Tenía forma de… notas manchadas.'],
      m:{type:'mystery',n:2,title:'Entre líneas y espacios',obj:'libro',mode:'place',noNames:true,
       intro:['—Mira: las notas doradas se apoyan sobre una línea. Las plateadas viven en el espacio entre dos.','—Estas notas se escaparon del libro. Toca la tecla que brille y volverán a su sitio.'],
       rounds:[{aid:2,colors:1,say:'Oro: sobre la línea. Plata: entre dos líneas.',seq:[{p:64},{p:65},{p:67},{p:69},{p:71}]},{aid:2,say:'Ahora sin colores: fíjate tú si cae en línea o en espacio.',seq:[{p:71},{p:69},{p:65},{p:67},{p:64}]}],
       reveal:'Las notas vuelven al libro.',revealSub:'Los lomos de la estantería brillan y en la pared aparece un pentagrama tenue.'}},
     {id:'a3',kind:'mystery',label:'Puerta de la clave',x:240,y:400,need:['a2'],locked:'Todavía no sabes leer la clave.',hint:'Abre la puerta de la clave de Sol.',
      after:['La clave gira y la puerta se abre. Al otro lado suena un eco de la melodía de medianoche… más cerca.','En el suelo hay huellas de tinta que entran en la sala.'],
      m:{type:'mystery',n:3,title:'La llave de Sol',obj:'puerta',mode:'key',
       intro:['—Este signo es la clave de Sol. Su espiral abraza la segunda línea.','—Ahí vive Sol: el primer nombre que vas a leer.','—Desde Sol, un paso hacia arriba es La. Otro paso más, Si.'],
       rounds:[{aid:1,say:'Toca Sol: la nota de la segunda línea.',seq:[{p:67}]},{aid:2,say:'Ahora la frase de la llave: Sol, La, Si, La, Sol.',seq:[{p:67},{p:69},{p:71},{p:69},{p:67}]}],
       reveal:'La clave gira… ¡la cerradura se abre!',revealSub:'Ya sabes dónde vive Sol. Desde él puedes contar paso a paso.'}}],
    exit:{x:240,y:452,label:'Sala de copia',ic:'🚪',need:['a3'],locked:'La puerta está cerrada con una clave de Sol.',hint:'La puerta está abierta: sigue las huellas de tinta.'}},
   /* SALA 2 · SALA DE COPIA */
   {type:'room',room:'copia',who:'isabella',act:'La sala de copia',start:[180,520],
    intro:['Atriles cubiertos de polvo, partituras en las paredes y un reloj de pesas detenido.','—Aquí copiaban la música de los grandes maestros.','—Mira esa firma en el atril: «M. C.»… Mi maestra nunca me habló de él.'],
    hot:[{id:'a4',kind:'mystery',label:'Escalera',x:60,y:220,hint:'Completa la escalera invisible.',codex:'m3_sello1',
      after:['En el último escalón hay una nota grabada en la piedra, distinta a todas.','—Es un sello… pero solo la mitad. Lo guardo en el Códice.'],
      m:{type:'mystery',n:4,title:'La escalera invisible',obj:'escalera',mode:'stairs',codex:'m3_sello1',
       intro:['—Cada escalón es una nota. Cuanto más arriba en el pentagrama, más aguda suena.','—Ahora sí: vas a leer.'],
       rounds:[{aid:1,say:'Sube: Mi, Fa, Sol, La, Si.',seq:[{p:64},{p:65},{p:67},{p:69},{p:71}]},{aid:2,say:'Ahora baja, solo con la tecla.',seq:[{p:71},{p:69},{p:67},{p:65},{p:64}]},{aid:3,say:'El último tramo, solo leyendo.',seq:[{p:67},{p:69},{p:71}]}],
       reveal:'La escalera queda firme.',revealSub:'En el último escalón brilla medio sello grabado en la piedra.'}},
     {id:'a5',kind:'mystery',label:'Reloj de pesas',x:180,y:175,need:['a4'],locked:'No llegas al reloj: faltan escalones.',hint:'Haz que el reloj de pesas vuelva a andar.',
      after:['@m3/llave|El reloj da las doce. En la esfera se abre un compartimento: dentro hay una llave de bronce.'],
      m:{type:'mystery',n:5,title:'El reloj detenido',obj:'reloj',mode:'hold',beat:800,
       intro:['—Este reloj se mueve con pesas. Su volante oscila una vez en cada pulso.','—Las notas también duran: negra, 1 oscilación; blanca, 2; redonda, 4.','—Mantén la tecla mientras la pesa baja hasta su marca.'],
       rounds:[{aid:1,say:'Negra: 1 oscilación del volante.',seq:[{p:67,d:'q'}]},{aid:1,say:'Blanca (hueca, con plica): 2 oscilaciones.',seq:[{p:69,d:'h'}]},{aid:1,say:'Redonda (hueca, sin plica): 4 oscilaciones.',seq:[{p:71,d:'w'}]},{aid:3,say:'Ahora mezcladas, solo leyendo.',seq:[{p:67,d:'q'},{p:69,d:'h'},{p:67,d:'q'},{p:64,d:'w'}]}],
       reveal:'El reloj vuelve a andar… y da la medianoche.',revealSub:'Las pesas bajan, el volante oscila y se abre un compartimento en la esfera.'}},
     {id:'a6',kind:'mystery',label:'Puerta de piedra',x:230,y:400,need:['a5'],locked:'La puerta de piedra tiene una cerradura con forma de silencio.',hint:'Usa la llave del reloj en la puerta de piedra.',
      after:['Sube un aire frío. La melodía de medianoche suena entera… y vuelve a cortarse.','Unas antorchas se encienden solas a lo largo de una escalera que baja.'],
      m:{type:'mystery',n:6,title:'El silencio necesario',obj:'puerta2',mode:'silence',beat:800,
       intro:['—La llave encaja. Ahora la puerta escucha.','—En la música, el silencio también se escribe. Cuando aparezca, espera sin tocar.'],
       rounds:[{aid:2,say:'Toca y respeta los silencios.',seq:[{p:67,d:'q'},{r:'q'},{p:69,d:'q'},{r:'q'},{p:71,d:'q'}]},{aid:3,say:'Ahora un silencio largo (2 pulsos), solo leyendo.',seq:[{p:71,d:'q'},{p:69,d:'q'},{r:'h'},{p:67,d:'q'}]}],
       reveal:'La puerta de piedra se hunde en el suelo.',revealSub:'Una escalera baja hacia el Archivo Subterráneo.'}}],
    exit:{x:230,y:452,label:'Bajar al archivo',ic:'⬇️',need:['a6'],locked:'La puerta de piedra está cerrada.',hint:'Baja al Archivo Subterráneo.'}},
   /* SALA 3 · BIBLIOTECA OLVIDADA */
   {type:'room',room:'biblio',who:'isabella',act:'Archivo · Biblioteca olvidada',start:[180,520],
    intro:['—El Archivo Subterráneo… Mi maestra decía que era una leyenda.','—Mira: alguien arrancó páginas a toda prisa.'],
    hot:[{id:'fr',kind:'mystery',label:'Fragmento',x:95,y:350,hint:'Salva el fragmento de partitura.',after:['Las páginas del suelo vuelan solas a sus estantes.','—Este fragmento es parte de la melodía de medianoche.'],
      m:{type:'mystery',title:'Fragmento de la biblioteca',obj:'frag',mode:'melody',codex:'m3_frag1',intro:['—Está casi borrado. Léelo y tócalo para salvarlo.'],
       rounds:[{aid:3,say:'Léelo: nadie te dirá los nombres.',seq:[{p:64},{p:67},{p:69},{p:67}]}],reveal:'Fragmento recuperado.',revealSub:'Lo guardas en el Códice del Compositor.'}},
     {id:'ret',kind:'talk',ic:'talk',label:'Retrato',x:290,y:330,opt:1,who:'isabella',lines:['@m3/retrato|Un retrato de un músico… con el rostro borrado por tinta. En la placa: «M. C.».','—Alguien no quería que lo recordáramos.']}],
    exit:{x:180,y:110,label:'Pasillo de los ecos',ic:'⬆️',need:['fr'],locked:'Primero salva el fragmento.',hint:'Sigue hacia el Pasillo de los ecos.'}},
   /* SALA 4 · PASILLO DE LOS ECOS */
   {type:'room',room:'pasillo',act:'Archivo · Pasillo de los ecos',start:[180,525],
    intro:['Las paredes están cubiertas de inscripciones musicales… con huecos donde faltan notas.','Algo se mueve: ¡Devoradores de Tinta! Se comen las notas escritas. Si te tocan, invoca tu piano.'],
    enemies:[{x:150,y:400,zone:[90,330,270,480],after:['El espíritu dorado devuelve una nota a la pared.'],f:{name:'Devorador de Tinta',hp:5,winText:'El Devorador recupera su forma: ahora es un pequeño espíritu dorado.',intro:['El Devorador se tragó las notas de la pared.','Lee cada nota en el pentagrama y tócala para devolverla.'],tasks:[{t:'read',ps:[67],names:true,hint:true,say:'Lee la nota y tócala'},{t:'read',ps:[64],names:true,hint:true,say:'Otra nota'}]}},
     {x:190,y:220,zone:[90,140,270,300],after:['La última nota vuelve a su sitio. En la pared se lee: «…buscad aquello que fue olvidado».','La frase empieza en otro lugar.'],f:{name:'Gran Devorador de Tinta',hp:5,winText:'El Gran Devorador se transforma en luz dorada. El pasillo queda libre.',tasks:[{t:'read',ps:[69],say:'Lee la nota: sin nombre'},{t:'read',ps:[65],say:'¿Y esta?'},{t:'read',ps:[67,69,71],say:'Tres notas subiendo'}]}}],
    exit:{x:180,y:105,label:'Cámara del manuscrito',ic:'⬆️',locked:'Los Devoradores bloquean el paso.',hint:'Devuelve la calma a los Devoradores.'}},

 /* ---------------- 04 ---------------- */
 {id:'w1m04',t:'El nacimiento de una nueva voz',d:'Construye tu primer laúd con Bernardo: madera del bosque, madera rara y la fibra de los carneros resonantes. Descubre sus poderes restauradores.',scene:true,game:true,
  disc:{id:'a-laud',name:'El laúd',per:'Renacimiento · siglos XV y XVI',text:'Instrumento de cuerda pulsada llegado a Europa desde el mundo árabe (del árabe «al-ʿūd»). La caja en forma de cuenco se armaba con costillas finas de arce, tejo o ciprés; la tapa era de abeto con una rosa calada. Las cuerdas, de tripa, iban casi todas en pares (órdenes) y se pulsaban con los dedos. Su música se escribía en tablatura. Hacia 1530 fue el instrumento más popular de Italia, con maestros como Francesco da Milano.',sig:'Pulsar una cuerda y dejar que una caja de resonancia la amplifique es la misma idea que, con un teclado y un mecanismo, usará el clavecín.'},
  steps:[
   {type:'scene',act:['Módulo 4','El nacimiento de una nueva voz'],img:'taller_fuera',move:'zoom',lines:['Cuando el Maestro Compositor desapareció, hace quince años, algunos instrumentos de Florencia empezaron a perder su voz.','Uno a uno se quedaron mudos. La gente dejó de tocarlos… y casi todos los olvidaron.','En tu bolsillo llevas el trozo de mapa del Maestro. En su borde hay un dibujo diminuto: un clavecín.']},
   {type:'citymap',from:'puerta',go:'taller',ck:1,act:'Misión 1 · El secreto de las cuerdas',mission:'Lleva el trozo de mapa al taller del maestro Bernardo.'},
   {type:'scene',img:'taller_m2',who:'maestro',move:'zoom',fl:{0:['m3/mapa_trozo'],4:['m2/instr_laud'],5:['m2/ic_madera_comun','m2/ic_resina','m2/ic_madera_rara','m2/ic_cuerdas']},lines:['—Ese dibujo… es un clavecín. Conozco a quien sabría leerlo: Beatrice, una antigua constructora de instrumentos que vive en las afueras.','—Cuando los instrumentos empezaron a callar, ella decidió guardarlos. Nadie sabe por qué se apagaron.','—Has aprendido a utilizar la fuerza de la música y a escuchar la naturaleza.','—Pero todavía desconoces uno de sus poderes más extraordinarios: devolver la vida a aquello que la ha perdido.','—Mira este laúd. Al pellizcar una cuerda, vibra; sola suena débil. La caja de resonancia, hueca y de madera fina, recoge esa vibración y la hace crecer.','—📜 Antiguamente, las cuerdas de los laúdes se hacían sobre todo con tripa de oveja.','—✨ Las tuyas serán mágicas: de la fibra de los carneros resonantes. Esta vez no hay regalos: también las cuerdas tendrás que ganártelas.']},
   {type:'recipe',ck:1,ph:'Receta del maestro Bernardo',title:'Laúd común',img:'m4/laud_nuevo',give:'laud',recipe:{madera_comun:16,savia_magica:6,madera_rara:3,fibra_resonante:4},okText:'Fabricar el laúd',goText:'Buscar los materiales',missing:'La madera y la savia están en el bosque; la madera rara, en los tocones dorados (con tu Piccolo resonante). La fibra resonante la dan los carneros de los pastizales, más allá del bosque.'},
   {type:'scene',img:'taller_m2',who:'maestro',move:'zoom',skipMats:{madera_comun:16,savia_magica:6,madera_rara:3},fl:{0:['bosque/abeto_1'],1:['m2/ic_madera_comun'],2:['m2/ic_resina'],3:['m2/ic_madera_rara']},lines:['—📜 Historia real: la tapa de un laúd suele ser de abeto, una madera ligera y elástica que vibra con facilidad.','—📜 La caja se arma con costillas finas y curvas de madera más dura, como el arce, el tejo o el ciprés.','—✨ En Mont Keys, la savia mágica hace que las cuerdas vibren más tiempo, y la madera rara guarda una vibración muy antigua.','—Tráeme 16 de madera común, 6 de savia mágica y 3 de madera rara.']},
   {type:'citymap',go:'oeste',skipMats:{madera_comun:16,savia_magica:6,madera_rara:3},act:'Misión 2 · La madera que canta',mission:'Sal por la puerta oeste hacia el bosque.'},
   {type:'forest',act:'Misión 2 · La madera que canta',skipMats:{madera_comun:16,savia_magica:6,madera_rara:3},recipe:{madera_comun:16,savia_magica:6,madera_rara:3},what:'la madera del laúd',mission:'Para el laúd: 16 de madera común, 6 de savia mágica y 3 de madera rara (tocones dorados, con el Piccolo resonante).'},
   {type:'citymap',from:'oeste',go:'este',ck:1,skipMats:{fibra_resonante:4},act:'Misión 3 · Más allá de la ciudad',mission:'Los carneros resonantes pastan al otro lado de la puerta este. Ve hacia allí.'},
   {type:'scene',img:'bosque',act:['Misión 3','Más allá de la puerta este'],skipMats:{fibra_resonante:4},fl:{2:['m4/carnero_idle']},lines:['Al otro lado de la puerta este, la ciudad termina y empiezan unas colinas de hierba alta, encendidas por el atardecer.','Los Pastizales del eco. Dicen que allí pastan criaturas con cuerpo, no espíritus: los carneros resonantes.','Su fibra hará las cuerdas de tu laúd. Pero cuidado: defienden su territorio y se esconden en la hierba.']},
   {type:'meadow',ck:1,act:'Misión 4 · El carnero resonante',skipMats:{fibra_resonante:4},recipe:{fibra_resonante:4},mission:'Calma a 2 carneros resonantes: cada uno da 2 de fibra resonante.'},
   {type:'citymap',from:'este',go:'carniceria',act:'Misión 5 · Los comerciantes de Florencia',mission:'Pasa por la carnicería de Piero, junto a la muralla sur: vende lo que no necesites o cocina algo para tu viaje.'},
   {type:'shop',shop:'carniceria'},
   {type:'citymap',from:'carniceria',go:'taller',act:'Misión 6 · El nacimiento del laúd',mission:'Lleva todos los materiales al taller del maestro Bernardo.'},
   {type:'stage',guard:{madera_comun:16,savia_magica:6,madera_rara:3,fibra_resonante:4},ph:'Etapa 1 de 5 · La madera',title:'Preparar la madera',img:'m4/fab_tablas',seq:[64,67,72],say:'—Cada nota que toques es una pasada del cepillo. Mi, Sol, Do: alisa las tablas.',real:'📜 La tapa del laúd suele ser de abeto; las costillas de la caja, de maderas más duras.',after:'—¡Qué tablas tan finas! Ya vibran solas cuando las golpeo con el dedo.',win:'Madera lista'},
   {type:'stage',guard:{madera_comun:16,savia_magica:6,madera_rara:3,fibra_resonante:4},ph:'Etapa 2 de 5 · La caja de resonancia',title:'La caja de resonancia',img:'m4/fab_caja',seq:[67,67],waves:[[5,'Cuerda sola: vibra poco'],[22,'Con la caja de resonancia: vibra mucho más']],say:'—Toca Sol dos veces. La primera, la cuerda sola; la segunda, sobre la caja. Mira la diferencia.',real:'📜 La caja hueca recoge la vibración de la cuerda y la hace crecer: por eso el laúd suena fuerte con tan poca fuerza.',after:'—¿Lo ves? La cuerda casi no se oye sola. La caja la convierte en voz.',win:'Caja de resonancia lista'},
   {type:'stage',guard:{madera_comun:16,savia_magica:6,madera_rara:3,fibra_resonante:4},ph:'Etapa 3 de 5 · El mástil',title:'El mástil y el clavijero',img:'m4/fab_mastil',imgs:[null,null,null,null,'m4/fab_laud_sin_cuerdas'],seq:[64,65,67,69,71],say:'—Sube nota a nota por el mástil: Mi, Fa, Sol, La, Si. En cada traste la cuerda se acorta y suena más aguda.',real:'📜 Los trastes del laúd eran de tripa atada alrededor del mástil.',after:'—Mástil y caja unidos. Solo faltan las cuerdas.',win:'Mástil unido'},
   {type:'craft',ph:'Etapa 4 de 5 · Las cuerdas',img:'m4/laud_nuevo',strings:[[30,160,258,44],[36,169,261,48],[43,177,264,52],[49,186,267,55],[56,194,270,59],[62,203,273,63]],give:'laud',pay:{madera_comun:16,savia_magica:6,madera_rara:3,fibra_resonante:4},okText:'Afinar el laúd',lines:['Bernardo convierte la fibra resonante en cuerdas…','Las tensa una por una, de la más grave a la más aguda.','¡Las cuerdas cantan! Ahora hay que afinarlas.']},
   {type:'stage',ph:'Etapa 5 de 5 · La afinación',title:'Afinar el laúd',img:'m4/laud_nuevo',strings:[[30,160,258,44],[36,169,261,48],[43,177,264,52],[49,186,267,55],[56,194,270,59],[62,203,273,63]],seq:[55,60,65,69,74,79],lo:55,hi:79,kind:'lute',say:'—Cada cuerda debe sonar en su nota: Sol, Do, Fa, La, Re, Sol. Tócalas de la más grave a la más aguda.',real:'📜 Un laúd renacentista muy usado se afinaba así, de grave a agudo: Sol, Do, Fa, La, Re, Sol. Aquí las tocas una octava más aguda; la clave de Fa llegará en el Módulo 5.',after:'—¡Perfecto! Tu laúd está afinado. Escucha cómo responde.',win:'Laúd afinado'},
   {type:'scene',img:'taller_m4afina',who:'maestro',move:'zoom',act:['Historia','El laúd del Renacimiento'],fl:{0:['m4/laud_nuevo'],1:['m4/laud_nuevo'],2:['m4/material_cuerdas_laud'],3:['m4/fab_caja'],4:['m4/fab_mastil'],5:['m4/fab_tablas']},lines:['—📜 El laúd llegó a Europa desde el mundo árabe, por España y Sicilia. Su nombre viene del árabe «al-ʿūd», que suele traducirse como «la madera».','—📜 En tiempos como estos, hacia 1530, es el instrumento más querido de Italia. Francesco da Milano, al que llaman «el divino», asombra a todos con el suyo.','—📜 Sus cuerdas van casi todas en pares, llamados órdenes: dos cuerdas afinadas igual que se pulsan juntas y suenan más llenas. Se tocan con las yemas de los dedos.','—📜 La caja es un cuenco hecho con costillas finísimas de arce, tejo o ciprés, dobladas al calor y pegadas una junto a otra. Es muy ligera: por eso vibra tanto.','—📜 La tapa es de abeto, con una rosa calada en el centro. El mástil lleva trastes de tripa atados, y el clavijero se dobla hacia atrás para aguantar la tensión de tantas cuerdas.','—📜 Y su música no se escribía en pentagrama: se usaba la tablatura, con líneas que representan las cuerdas y números que indican en qué traste poner el dedo.']},
   {type:'scene',img:'taller_m2',who:'maestro',move:'zoom',ck:1,act:['Misión 7','La música que devuelve la vida'],fl:{0:['m2/instr_laud']},lines:['—Las cuerdas poseen una cualidad diferente. Pueden devolver aquello que el silencio nos ha arrebatado.','—Observa estas notas. No necesitas tocarlas con fuerza, sino comprender su melodía.']},
   {type:'lute',ph:'Ejercicio 1',title:'Las primeras cuerdas',text:'Tres notas seguidas, subiendo por el pentagrama. Debajo de cada nota verás su nombre.',seq:[64,65,67],names:'all',hint:'always',who:'maestro',say:'—Mi, Fa, Sol. Pellizca cada cuerda con calma.',win:'¡Tus primeras cuerdas!'},
   {type:'lute',ph:'Ejercicio 2',title:'La melodía ascendente',text:'Cinco notas que suben, una tras otra. Ahora solo verás el nombre de la primera.',seq:[64,65,67,69,71],names:'first',hint:'miss',who:'maestro',say:'—Empieza en Mi y sube paso a paso por líneas y espacios.',win:'¡La melodía sube sin tropiezos!'},
   {type:'lute',ph:'Ejercicio 3',title:'La melodía vital',text:'Una frase que sube y vuelve a bajar. Sin nombres: léela en el pentagrama. Al terminarla, verás qué puede hacer tu laúd.',seq:[67,69,71,72,71,69,67],names:'none',hint:'miss',who:'maestro',say:'—Sube hasta Do y regresa a Sol. Escucha cómo respira la frase.',hearts:{have:2,max:3},win:'Recuperas un corazón',vital:1},
   {type:'scene',img:'taller_m4laud',who:'maestro',move:'zoom',lines:['—¡Eso es la Melodía vital! Si una criatura o un espíritu te hiere, tu laúd puede devolverte un corazón, una vez en cada encuentro.','—Pero las cuerdas hacen algo más. Mira esta planta: lleva semanas marchita en mi ventana.']},
   {type:'lute',ph:'Canto de la germinación',title:'Canto de la germinación',text:'Con cada nota correcta, la planta recupera un poco de vida. Toca la melodía hasta el final.',target:'m4/planta_marchita',grow:['m4/planta_marchita','m4/planta_recupera','m4/planta_brotes','m4/planta_florecida'],seq:[60,64,67,72,71,67,64,65,67],names:'first',hint:'miss',who:'maestro',tag:'Laúd común · Crecimiento',say:'—Despacio. Las plantas escuchan con paciencia.',win:'¡La planta ha florecido!'},
   {type:'scene',img:'taller_m4laud',who:'maestro',move:'zoom',fl:{0:['m4/planta_florecida']},lines:['—La música no solamente puede despertar aquello que duerme. También puede devolver la esperanza a quien la ha perdido.','—Este mismo poder podrá ayudar a personas debilitadas por la magia… algún día lo necesitarás.','—Creo que ya estás preparado para conocer a Beatrice. Vive junto a un jardín olvidado, al otro lado de la puerta norte.'],accept:'Completar el módulo',reward:'🏅 Módulo 4 completado: El nacimiento de una nueva voz'}
  ]},
 /* ---------------- 05 (provisional) ---------------- */
 {id:'w1m05',t:'El taller de las voces dormidas',d:'Beatrice, el jardín olvidado y los instrumentos de teclado: el clavecín y el clavicordio. (Versión provisional mientras se construye la aventura.)',
  disc:{id:'a-clavecin',name:'El clavecín',per:'Usado sobre todo entre los siglos XVI y XVIII',text:'Instrumento de teclado en el que cada tecla acciona una pieza que pulsa la cuerda con una púa, tradicionalmente de pluma de ave. Las primeras menciones de instrumentos de este tipo aparecen hacia finales del siglo XIV.',sig:'Pulsar la cuerda da casi el mismo volumen sin importar la fuerza del dedo: por eso se buscaba un teclado más expresivo.'},
  steps:[
   {type:'story',ph:'Descubrir',art:'harpsi',title:'El clavecín',text:'Antes del piano, el gran instrumento de teclado era el clavecín. Al bajar una tecla, una púa sube y pellizca la cuerda. Su sonido es brillante, y toques fuerte o suave suena casi igual.',fact:'Muy usado en el Renacimiento y el Barroco.'},
   {type:'story',ph:'Descubrir',art:'clavi',title:'El clavicordio',text:'En el clavicordio una pequeña lámina de metal (la tangente) golpea la cuerda y se queda tocándola. Permitía matices, pero sonaba tan suave que servía sobre todo para estudiar en casa.',fact:'Con el clavicordio se podía hacer un ligero vibrato moviendo el dedo.'},
   {type:'compare',ph:'Práctica',q:'Compara: la misma nota suave y fuerte',a:'harpsi',b:'piano',why:'En el clavecín las dos ondas son casi iguales. En el piano, la fuerte es mucho más grande.'},
   {type:'timbre',ph:'Práctica',q:'¿Qué instrumento es?',items:[{kind:'harpsi',opts:['Clavecín','Piano'],a:0},{kind:'piano',opts:['Clavecín','Piano'],a:1},{kind:'harpsi',opts:['Piano','Clavecín'],a:1}]},
   {type:'choice',ph:'Práctica',q:'¿Cuál era la limitación del clavecín?',opts:['No tenía notas agudas','No permitía tocar más fuerte o más suave con el dedo','Era muy pequeño'],a:1,why:'Esa limitación es la que intentaría resolver Cristofori.'},
   {type:'melody',ph:'Reto creativo',q:'Toca una melodía con sonido de clavecín',sub:'Sigue las teclas iluminadas. Al terminar, tócala de nuevo con sonido de piano y compara.',notes:[60,62,64,65,67,65,64,62,60],kind:'harpsi',show:'keys',lo:57,hi:72,again:'piano'}
  ]},
  /* ---------------- 05 ---------------- */
 {id:'w1m06',t:'El nacimiento del piano',d:'Bartolomeo Cristofori y su mecanismo de martillos, hacia 1700: tocar piano y forte.',
  disc:{id:'a-cristofori',name:'El piano de Cristofori',per:'Florencia · hacia 1700',text:'Bartolomeo Cristofori (1655–1731), constructor de instrumentos al servicio de Fernando de Médici, creó un teclado en el que martillos golpean las cuerdas. Un inventario de los Médici del año 1700 ya lo describe. El piano más antiguo que se conserva es suyo y data de 1720 (Museo Metropolitano de Nueva York).',sig:'Por primera vez, la fuerza del dedo controlaba el volumen: el «gravicembalo col piano e forte».'},
  steps:[
   {type:'story',ph:'Descubrir',art:'cristofori',title:'Bartolomeo Cristofori',text:'Cristofori trabajaba en Florencia para el príncipe Fernando de Médici. Hacia 1700 terminó un instrumento nuevo: un martillo golpea la cuerda y rebota enseguida, dejándola vibrar. Cuanto más rápido baja el dedo, más fuerte suena.',fact:'«Gravicembalo col piano e forte»: de ahí viene la palabra «piano».'},
   {type:'story',ph:'Aprender',art:'dyn',title:'Piano y forte',text:'«Piano» (p) significa suave y «forte» (f) significa fuerte. En este teclado, toca cerca del fondo de la tecla (arriba) para tocar suave y cerca de la punta (abajo) para tocar fuerte. El medidor te muestra la intensidad.',fact:'pp · p · mp · mf · f · ff'},
   {type:'dyn',ph:'Práctica',q:'Piano y forte',sub:'Sigue lo que pide cada nota.',items:['p','f','p','f','f','p']},
   {type:'cresc',ph:'Práctica',q:'Crescendo',sub:'Toca 5 notas, cada una un poco más fuerte que la anterior.',dir:'up',count:5},
   {type:'melody',ph:'Reto creativo',q:'La misma melodía, dos expresiones',sub:'Primero tócala toda piano (suave)…',notes:[64,64,65,67,67,65,64,62],show:'keys',lo:57,hi:72,dynReq:'p'},
   {type:'melody',ph:'Reto creativo',q:'…y ahora forte',sub:'La misma melodía, ahora toda fuerte. ¿Notas cómo cambia el carácter?',notes:[64,64,65,67,67,65,64,62],show:'keys',lo:57,hi:72,dynReq:'f'}
  ]},
 /* ---------------- 06 ---------------- */
 {id:'w1m07',t:'Las siete teclas',d:'Orientarse en el teclado: los Do, los grupos de teclas negras, graves y agudos.',
  disc:{id:'a-utremi',name:'Ut, re, mi: los nombres de las notas',per:'Siglo XI en adelante',text:'Guido d’Arezzo usó las sílabas iniciales de los versos del himno «Ut queant laxis» (ut, re, mi, fa, sol, la) para enseñar a cantar. Más tarde «ut» se cambió por «do» (un cambio que suele atribuirse a Giovanni Battista Doni, en el siglo XVII) y se añadió «si».',sig:'En los países latinos usamos Do-Re-Mi; en los anglosajones, letras: C D E F G A B.'},
  steps:[
   {type:'story',ph:'Descubrir',art:'groups',title:'Siete nombres y dos grupos',text:'Las teclas blancas tienen siete nombres: Do, Re, Mi, Fa, Sol, La, Si, y luego se repiten. Las negras van en grupos de dos y de tres: el Do está justo a la izquierda del grupo de dos, y el Fa a la izquierda del grupo de tres.',fact:'C D E F G A B = Do Re Mi Fa Sol La Si'},
   {type:'keys',ph:'Práctica',lo:36,hi:84,labels:false,items:[{say:'Encuentra un Do',pc:0},{say:'Otro Do distinto',pc:0,notSame:true},{say:'Y otro Do más',pc:0,notSame:true}]},
   {type:'keys',ph:'Práctica',lo:48,hi:72,labels:false,items:[{say:'Toca una negra de un grupo de DOS',pcs:[1,3]},{say:'Toca una negra de un grupo de TRES',pcs:[6,8,10]}]},
   {type:'keys',ph:'Práctica',lo:48,hi:72,labels:false,random:5,items:[]},

 {id:'w1m10',t:'El arte de la melodía',d:'Subir y bajar, repetir y variar, completar frases y crear preguntas y respuestas.',
  disc:{id:'a-pavana',name:'Pavana y gallarda',per:'Danzas cortesanas · siglo XVI',text:'En las cortes renacentistas se bailaban danzas que a menudo iban en pareja: la pavana, lenta y en compás binario, seguida de la gallarda, rápida y en ternario, que muchas veces reutilizaba la misma melodía.',sig:'Una misma idea musical, repetida y transformada, ya era una herramienta de composición hace 500 años.'},
  steps:[
   {type:'story',ph:'Aprender',art:'contour',title:'La forma de una melodía',text:'Una melodía puede subir (ascendente), bajar (descendente) o repetir notas. Las melodías que recordamos mezclan las tres cosas y suelen repetir una idea con pequeños cambios: eso se llama variación.',fact:'Pregunta = frase que queda abierta · Respuesta = frase que cierra.'},

 {id:'w1m11',t:'El lenguaje de la expresión',d:'Dinámicas, staccato y legato, crescendo y diminuendo: darle personalidad a la música.',
  disc:{id:'a-gabrieli',name:'«Sonata pian’ e forte»',per:'Venecia · 1597',text:'Giovanni Gabrieli publicó en 1597 una sonata para conjunto de instrumentos que se considera una de las primeras obras con indicaciones escritas de piano y forte. Los términos de expresión en italiano se volvieron el idioma común de los músicos.',sig:'Por eso en todo el mundo escribimos piano, forte, crescendo o legato… en italiano.'},
  steps:[

   {type:'cresc',ph:'Práctica',q:'Diminuendo',sub:'5 notas, cada una más suave.',dir:'down',count:5},
   {type:'timbre',ph:'Práctica',q:'¿Cómo se tocó?',mode:'artic',items:[{art:'s',opts:['Staccato','Legato'],a:0},{art:'l',opts:['Staccato','Legato'],a:1}]},
   {type:'melody',ph:'Reto creativo',q:'Una melodía, dos personalidades',sub:'Primero tócala staccato: notas cortas…',notes:[67,65,64,62,60],show:'keys',lo:57,hi:72,artReq:'s'},
   {type:'melody',ph:'Reto creativo',q:'…y ahora legato',sub:'La misma melodía, manteniendo cada nota.',notes:[67,65,64,62,60],show:'keys',lo:57,hi:72,artReq:'l'}

  disc:{id:'a-bocetos',name:'Los cuadernos de bocetos',per:'Una costumbre de siglos',text:'Muchos compositores anotaban ideas sueltas antes de convertirlas en obras. Los cuadernos de bocetos de Beethoven, por ejemplo, muestran temas reescritos una y otra vez hasta encontrar su forma final.',sig:'Componer no es acertar a la primera: es probar, cambiar y volver a probar.'},

 return {loc:st[n].go,start:i,act:st[n].act||cap,mission:st[n].mission||'',cap}}

   const att=kind==='lute'?.004:kind==='flute'?.06:.09,A=amp*(kind==='strings'?.7:1);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(A,t+att);if(kind==='lute')g.gain.exponentialRampToValueAtTime(.001,t+Math.max(.5,dur+.4));else{g.gain.setValueAtTime(A,t+Math.max(att,dur));g.gain.linearRampToValueAtTime(0,t+dur+.15)}g.connect(master);[o,lfo].forEach(x=>{x.start(t);x.stop(t+dur+.6)});return}

let mic=null;
async function micOn(onNote){if(mic)return true;try{let st;try{st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}})}catch(e){if(e&&e.name==='NotAllowedError')throw e;st=await navigator.mediaDevices.getUserMedia({audio:true})}
  const a=ac(),src=a.createMediaStreamSource(st),an=a.createAnalyser();an.fftSize=2048;src.connect(an);const buf=new Float32Array(2048);let last=-1,since=0,fired=-1,run=true;
  (function loop(){if(!run)return;an.getFloatTimeDomainData(buf);const f=detect(buf,a.sampleRate);if(f){const p=Math.round(69+12*Math.log2(f/440));if(p===last){if(performance.now()-since>120&&fired!==p){fired=p;onNote(p)}}else{last=p;since=performance.now()}}else{last=-1;fired=-1}requestAnimationFrame(loop)})();
  mic={stop(){run=false;st.getTracks().forEach(t=>t.stop());mic=null}};return true}catch(e){toast('No pude usar el micrófono'+(e&&e.name?' ('+e.name+')':'')+'. Usa el teclado de la pantalla.');return false}}
function detect(b,sr){let rms=0;for(let i=0;i<b.length;i++)rms+=b[i]*b[i];rms=Math.sqrt(rms/b.length);if(rms<.015)return 0;const n=b.length/2;let best=0,bl=-1;for(let lag=Math.floor(sr/1100);lag<Math.floor(sr/60);lag++){let c=0;for(let i=0;i<n;i++)c+=b[i]*b[i+lag];if(c>best){best=c;bl=lag}}if(bl<0)return 0;let e=0;for(let i=0;i<n;i++)e+=b[i]*b[i];if(best/e<.5)return 0;return sr/bl}

  whites.forEach((p,i)=>{const k=document.createElement('div');k.className='kw';k.style.left=(i*ww)+'%';k.style.width=ww+'%';k.dataset.p=p;if(labels)k.textContent=nm(p);kb.appendChild(k);els[p]=k});

function mStaff(o={}){const ns=o.notes||[],gap=10,top=26,bot=top+gap*4,sp=o.sp||50,x0=70,W=o.w||Math.max(200,x0+ns.length*sp+20),H=o.h||(o.names||o.hair||o.dyn?128:104);
 const Y=p=>bot-(dia(p)-dia(64))*gap/2,G='#ffd98c';let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" class="mst">`;
 for(let i=0;i<5;i++)s+=`<path d="M8 ${top+i*gap}H${W-8}" stroke="${G}" stroke-opacity=".75" stroke-width="1.2"/>`;
 s+=`<text x="10" y="${bot+11}" font-size="62" fill="${G}" font-family="'Noto Music','Bravura','Apple Symbols','Segoe UI Symbol',serif">𝄞</text>`;
 const xs=ns.map((n,i)=>x0+i*sp+sp/2-6);
 ns.forEach((n,i)=>{const x=xs[i];if(n.d==='r'){s+=`<path d="M${x-3} ${top+8} l7 8 l-6 7 l7 8 q-9 -4 -7 6 q-8 -10 2 -9 l-6 -7 l6 -7z" fill="${G}"/>`;return}
  const ps=n.ps||[n.p],lo=Math.min(...ps),hi=Math.max(...ps),up=(lo+hi)/2<71;
  ps.forEach(p=>{const y=Y(p);for(let ly=bot+gap;ly<=y+.1;ly+=gap)s+=`<path d="M${x-11} ${ly}H${x+11}" stroke="${G}" stroke-width="1.3"/>`;for(let ly=top-gap;ly>=y-.1;ly-=gap)s+=`<path d="M${x-11} ${ly}H${x+11}" stroke="${G}" stroke-width="1.3"/>`;
   s+=`<ellipse cx="${x}" cy="${y}" rx="6.6" ry="4.7" transform="rotate(-20 ${x} ${y})" fill="${n.d==='h'||n.d==='w'?'none':G}" stroke="${G}" stroke-width="${n.d==='h'||n.d==='w'?2:1}"/>`;if(isBlack(p))s+=`<text x="${x-17}" y="${y+5}" font-size="14" fill="${G}">♯</text>`});
  if(n.d!=='w'){const yl=Y(lo),yh=Y(hi);s+=up?`<path d="M${x+6} ${yl-1}V${yh-30}" stroke="${G}" stroke-width="1.6"/>`:`<path d="M${x-6} ${yh+1}V${yl+30}" stroke="${G}" stroke-width="1.6"/>`;
   if(n.st)s+=`<circle cx="${x}" cy="${up?Y(lo)+11:Y(hi)-11}" r="2.4" fill="${G}"/>`;
   if(n.tr){s+=`<text x="${x-8}" y="${top-14}" font-size="15" font-style="italic" font-weight="700" fill="${G}" font-family="Georgia,serif">tr</text><path d="M${x+8} ${top-19} q3 -4 6 0 t6 0 t6 0 t6 0 t6 0 t6 0" fill="none" stroke="${G}" stroke-width="1.4"/>`}}});
 if(o.slur&&ns.length>1){const a=xs[0],b=xs[xs.length-1],yy=Math.min(...ns.map(n=>Y(Math.max(...(n.ps||[n.p||71])))))-34;s+=`<path d="M${a} ${yy+10} Q${(a+b)/2} ${yy-12} ${b} ${yy+10}" fill="none" stroke="${G}" stroke-width="2"/>`}
 if(o.hair){const a=xs[0]-6,b=xs[xs.length-1]+6,yy=bot+24;s+=o.hair==='<'?`<path d="M${b} ${yy-6} L${a} ${yy} L${b} ${yy+6}" fill="none" stroke="${G}" stroke-width="1.6"/>`:`<path d="M${a} ${yy-6} L${b} ${yy} L${a} ${yy+6}" fill="none" stroke="${G}" stroke-width="1.6"/>`}
 if(o.dyn)Object.entries(o.dyn).forEach(([i,t])=>{s+=`<text x="${xs[+i]-6}" y="${bot+(o.hair?44:28)}" font-size="20" font-style="italic" font-weight="700" fill="${G}" font-family="Georgia,serif">${t}</text>`});
 if(o.names)ns.forEach((n,i)=>{if(n.d==='r')return;const t=(n.ps||[n.p]).map(p=>NAMES[p%12]).join('·');s+=`<text x="${xs[i]}" y="${H-6}" font-size="12" text-anchor="middle" fill="${G}" font-family="Cinzel,serif">${t}</text>`});
 return `<div class="mstaff${o.cls?' '+o.cls:''}">${s}</svg>${o.cap?`<p class="mcap">${o.cap}</p>`:''}</div>`}

function finishLesson(){const {W,L,fin,review}=LS;$('#lBar').style.width='100%';const stars=LS.miss<=1?3:LS.miss<=4?2:1;const was=!!S.done[L.id],xp=review||was?10:(fin?200:20),coins=review||was?0:(fin?100:10);
 const prev=S.done[L.id]||0;S.done[L.id]=Math.max(prev,stars);if(!review){S.facts=S.facts||{};S.facts['cap:'+L.id]=S.facts['cap:'+L.id]||Date.now();if(S.route&&S.route.ch===L.id){const nx=CH_IDS.find(id=>!S.done[id]);S.route={ch:nx||L.id,step:0,track:S.route.track!==false}}if(L.id==='w1m01'){['campanario_vivo','fuente_viva','plaza_luz','musicos_reunidos','guardian_despierto'].forEach(k=>{S.facts[k]=S.facts[k]||Date.now()});if(S.wstate){Object.assign(S.wstate.places,{campanario:'vivo',fuente:'viva',plaza:'luz',escenario:'musicos'});S.wstate.gates.oeste=true}}}S.xp+=xp;S.coins+=coins;const newDisc=L.disc&&!S.archive.includes(L.disc.id);if(newDisc)S.archive.push(L.disc.id);bumpStreak();save();
 const st=[0,1,2].map(i=>`<svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 21l1.6-7L2 9.2l7.1-.6z" fill="${i<stars?'#f3d48e':'rgba(241,230,207,.15)'}" stroke="${i<stars?'#8c6326':'none'}"/></svg>`).join('');
 $('#lStage').innerHTML=`<div class="done"><span class="lphase">${fin?'Mundo completado':'Lección completada'}</span><p class="lq" style="font-family:var(--display)">${esc(L.t)}</p><div class="stars">${st}</div><p class="ltext">+${xp} XP${coins?` · +${coins} florines`:''}${S.streak.n>1?` · racha de ${S.streak.n} días`:''}</p>
  ${L.disc?`<div class="acard"><span class="per">${newDisc?'Nuevo en tu Archivo':'En tu Archivo'} · ${esc(L.disc.per)}</span><h3>${esc(L.disc.name)}</h3><p>${esc(L.disc.text)}</p><p><b>Por qué importa:</b> ${esc(L.disc.sig)}</p></div>`:''}
  ${fin?`<div class="stamp on" style="--sc:${W.stampColor};width:120px">SELLO<br>${esc(W.place.toUpperCase())}</div>`:''}</div>`;
 $('#lFoot').innerHTML='';if(LS.lastComp){const lc=LS.lastComp;setTimeout(()=>{const b=document.createElement('button');b.className='ghost';b.type='button';b.style.marginTop='8px';b.textContent='Abrir mi composición en el estudio';b.onclick=()=>openInStudio(lc);$('#lFoot').appendChild(b)},0)}foot(freeOn()&&!MEMORY?'Volver a Florencia':MEMORY?'Volver al presente':'Volver al mapa',()=>{exitLesson();if(fin&&curW<WORLDS.length-1)toast('¡Sello obtenido! Se desbloqueó la siguiente isla: ve con la flecha ›.')},{gold:true})}

function allDiscs(){const out=[];WORLDS.forEach(w=>{if(w.preview)return;w.lessons.concat([w.finale]).forEach(l=>{if(l.disc)out.push(l.disc)})});return out}
